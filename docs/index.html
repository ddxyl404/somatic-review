<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Somatic / Review</title>
<meta name="description" content="scRNA-seq 体细胞突变算法文献调研：文章结构、比较协议、指标与切入角度。"/>
<meta name="theme-color" content="#e30613"/>
<link rel="icon" href="./favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f7f5f0;--paper:#fff;--ink:#111;--muted:#5a5a5a;--faint:#8a8a8a;--accent:#e30613;--wash:#eceae4}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans SC",Helvetica,Arial,sans-serif}
button,a{cursor:pointer}
::selection{background:var(--accent);color:#fff}
.wrap{max-width:1280px;margin:0 auto}
.grid12{display:grid;grid-template-columns:repeat(12,1fr)}
header{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--ink)}
header .brand{grid-column:span 12;display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:12px 16px;border-bottom:1px solid var(--ink);font-family:"Inter Tight",sans-serif;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
header nav{grid-column:span 12;display:flex;overflow-x:auto}
header nav a{flex:0 0 auto;min-height:48px;display:flex;align-items:center;padding:12px;border-left:1px solid var(--ink);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
header nav a:first-child{border-left:0}
header nav a:hover{background:var(--ink);color:var(--bg)}
h1,h2,h3{font-family:"Inter Tight",sans-serif;font-weight:600;letter-spacing:-.02em}
.slash{color:var(--accent)}
.hero-left{grid-column:span 12;padding:40px 16px;border-bottom:1px solid var(--ink)}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
h1{margin:24px 0 0;font-size:clamp(2.4rem,7vw,5.6rem);line-height:.95}
.lede{margin-top:24px;max-width:36rem;font-size:1.125rem;line-height:1.5}
.stats{grid-column:span 12;display:grid;grid-template-columns:1fr 1fr}
.stat{padding:24px 16px;border-bottom:1px solid var(--ink);border-right:1px solid var(--ink)}
.stats .stat:nth-child(2n){border-right:0}
.stat b{display:block;font-family:"Inter Tight",sans-serif;font-size:1.875rem}
.stat span{display:block;margin-top:8px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
section{border-bottom:1px solid var(--ink)}
.sec-k{grid-column:span 12;padding:24px 16px;border-bottom:1px solid var(--ink)}
.sec-b{grid-column:span 12;padding:32px 16px}
.idx{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.en{margin-top:12px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h2{margin:0;font-size:clamp(1.75rem,4vw,3rem);line-height:1.05}
.muted{color:var(--muted);line-height:1.65;font-size:15px;max-width:42rem}
.box{border:1px solid var(--ink);margin-top:32px}
.row{display:grid;grid-template-columns:repeat(12,1fr);border-bottom:1px solid var(--ink)}
.row:last-child{border-bottom:0}
.num{grid-column:span 3;padding:20px 16px;border-right:1px solid var(--ink);font-family:"Inter Tight",sans-serif;font-size:1.75rem;color:var(--accent)}
.body{grid-column:span 9;padding:20px 16px}
.filters{display:flex;flex-wrap:wrap;border:1px solid var(--ink);margin-top:24px}
.filters button{min-height:44px;border:0;border-right:1px solid var(--ink);background:var(--paper);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:12px 16px}
.filters button.on{background:var(--ink);color:var(--bg)}
.paper{display:grid;grid-template-columns:repeat(12,1fr);border:1px solid var(--ink);border-top:0;text-decoration:none;color:inherit}
.paper:hover{background:var(--wash)}
.paper .y{grid-column:span 3;padding:20px 16px;border-right:1px solid var(--ink);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.paper .y em{display:block;margin-top:8px;color:var(--accent);font-style:normal}
.paper .t{grid-column:span 9;padding:20px 16px}
.paper h3{margin:0;font-size:1.15rem}
.cols{display:grid;grid-template-columns:1fr;border:1px solid var(--ink);margin-top:32px}
.cell{padding:20px 16px;border-bottom:1px solid var(--ink)}
.cell:last-child{border-bottom:0}
.mono{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:32px;border:1px solid var(--ink)}
th{background:var(--ink);color:var(--bg);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:12px;text-align:left;border-right:1px solid rgba(255,255,255,.2)}
td{padding:12px;border-top:1px solid var(--ink);border-right:1px solid var(--ink);vertical-align:top}
footer{background:var(--ink);color:var(--bg)}
footer .a{grid-column:span 12;padding:40px 16px;border-bottom:1px solid rgba(255,255,255,.2)}
footer .b{grid-column:span 12;padding:40px 16px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.page{display:none}
.page.on{display:block}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid var(--ink);text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{background:var(--accent)}
@media(min-width:768px){
header .brand{grid-column:span 4;border-bottom:0;border-right:1px solid var(--ink);padding:12px 24px}
header nav{grid-column:span 8}
.hero-left{grid-column:span 8;border-bottom:0;border-right:1px solid var(--ink);padding:80px 24px}
.stats{grid-column:span 4;grid-template-columns:1fr}
.stat{border-right:0;padding:24px 32px}
.sec-k{grid-column:span 3;border-bottom:0;border-right:1px solid var(--ink);padding:64px 24px}
.sec-b{grid-column:span 9;padding:64px 40px}
.num{grid-column:span 2;padding:20px 24px}
.body{grid-column:span 10;padding:20px 32px}
.paper .y{grid-column:span 2;padding:20px 24px}
.paper .t{grid-column:span 10;padding:20px 32px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-2 .cell{border-right:1px solid var(--ink)}
.cols-2 .cell:nth-child(2n){border-right:0}
.cols-3{grid-template-columns:1fr 1fr 1fr}
.cols-3 .cell{border-right:1px solid var(--ink)}
.cols-3 .cell:nth-child(3n){border-right:0}
footer .a{grid-column:span 6;border-bottom:0;border-right:1px solid rgba(255,255,255,.2);padding:40px 24px}
footer .b{grid-column:span 6;padding:40px 40px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = {"papers":[{"id":"liu2019","year":2019,"authors":"Liu, Zhang, Zhang, Li, Fang, Gao, Zhang","short":"Liu et al.","title":"Systematic comparative analysis of single-nucleotide variant detection methods from single-cell RNA sequencing data","titleZh":"scRNA-seq 单核苷酸变异检测方法的系统比较","journal":"Genome Biology","doi":"10.1186/s13059-019-1863-4","pmid":"31744515","kind":"benchmark","oneLiner":"领域第一篇系统基准：把七个 bulk/RNA 变异检测器直接打在 scRNA-seq 上，量化 reads、VAF、基因组区域对性能的影响。","structure":[{"n":"00","title":"Background","note":"提出用 scRNA-seq 检测表达变异的动机：细胞异质性、谱系、基因型–表型连结；指出尚无专为 scRNA-seq 设计的 caller，且现有工具未被评估。"},{"n":"01","title":"Results · Simulation","note":"先用模拟数据控制变量：supporting reads、VAF、区域类型。报告 TPR 与 FDR，而不是只给一个总分。"},{"n":"02","title":"Results · Real data","note":"再用真实 scRNA-seq 复现：把仿真结论外推到真实覆盖与表达偏差。"},{"n":"03","title":"Results · Parameter sweep","note":"对关键超参做扫描（如 MuTect2 的 LOD），证明排名会随阈值移动。"},{"n":"04","title":"Discussion / Recommendation","note":"不宣布单一赢家，而是按使用条件给出工具菜单：低覆盖用 SAMtools，读数充足用 Strelka2，高 VAF 用 FreeBayes。"}],"comparedTo":["SAMtools","GATK Best Practices","CTAT","FreeBayes","MuTect2","Strelka2","VarScan2"],"metricsUsed":["TPR / Sensitivity","FDR","Precision","Supporting reads","VAF"],"angles":["工具迁移：bulk RNA/DNA caller 能否直接用于 scRNA-seq","覆盖深度与 supporting reads 作为性能的主轴","变异等位基因频率（VAF）分层","基因组语境：外显子 vs 内含子 vs 高同一性区域"],"datasets":["模拟 scRNA-seq","真实 scRNA-seq（多数据集）"],"groundTruth":"模拟植入的已知 SNV；真实数据以期望位点与深度分层评估。","howTheyCompare":"统一输入 BAM，默认参数为主实验，再对关键参数做敏感性分析。金标准在模拟中完全已知。按 supporting reads（>2、≥10）与 VAF（25/50/75%）切片报告 TPR 与 FDR，避免单一平均掩盖条件依赖性。","numbers":[{"label":"工具数","value":"7"},{"label":"≥10 reads 中位敏感度","value":">99%"},{"label":"中位 FDR","value":"≤0.2%"},{"label":"MuTect2 最大 FDR","value":"2.4%"},{"label":"SAMtools TPR @VAF25","value":"76.6%"}],"keyFindings":["SAMtools 在低 supporting reads 下敏感度最高，但内含子/高同一性区域特异性较差。","Strelka2 在读数充足时表现稳定。","FreeBayes 在高 VAF 时表现好，低 VAF 时 TPR 急剧下降。","VarScan2 需要更多 reads 才能给出可靠结果。","结论是条件化推荐，而不是总冠军。"],"takeaway":"比较文章的原型结构：模拟控变量 → 真实数据验证 → 参数扫描 → 按场景推荐。后续方法论文几乎都引用这篇作为「bulk caller 直接套用不够」的起点。"},{"id":"vu2019","year":2019,"authors":"Vu, Bansal, Chen, et al.","short":"Vu et al.","title":"Cell-level somatic mutation detection from single-cell RNA sequencing","titleZh":"从 scRNA-seq 做细胞水平的体细胞突变检测（SCmut）","journal":"Bioinformatics","doi":"10.1093/bioinformatics/btz288","kind":"method","tool":"SCmut","oneLiner":"不追求 de novo 发现，而是把 bulk DNA 已确认的突变基因型化到每一个细胞，用二维局部 FDR 压假阳性。","structure":[{"n":"00","title":"Motivation","note":"先用实验证明：为 bulk 或 scDNA 设计的 caller 直接跑 scRNA-seq 会产生大量假阳性。"},{"n":"01","title":"Method","note":"两步：bulk 肿瘤/正常 DNA 收集体细胞突变；再与单细胞 RNA SNV 联合，用 2D local FDR 判定哪些细胞携带该突变。"},{"n":"02","title":"Benchmark","note":"在乳腺癌等 scRNA-seq 上与 Mutect、VarScan2、Monovar 比 FPR。"},{"n":"03","title":"Application","note":"把突变映射回细胞，连接克隆与表达表型。"}],"comparedTo":["Mutect","VarScan2","Monovar"],"metricsUsed":["FPR","2D local FDR"],"angles":["任务重定义：cell genotyping vs de novo calling","假阳性控制作为方法核心，而非发现力","必须有配对 bulk DNA 作为先验"],"datasets":["乳腺癌 scRNA-seq（含 BC03）","配对 bulk DNA"],"groundTruth":"bulk 肿瘤–正常 DNA 的体细胞突变集合。","howTheyCompare":"把 Mutect / VarScan2 / Monovar 当作「直接在 scRNA 上 calling」的基线，证明 FPR 不可接受，从而正当化「先 bulk 发现、再细胞分型」的两阶段设计。比较的主指标是假阳性率，而不是敏感度。","numbers":[{"label":"统计框架","value":"2D local FDR"},{"label":"输入依赖","value":"配对 bulk DNA"},{"label":"任务","value":"细胞分型"}],"keyFindings":["bulk 与 scDNA caller 在 scRNA-seq 上假阳性过高，不能直接用。","有配对 DNA 时，细胞水平检出是统计问题（FDR），不是单纯 pileup 阈值问题。"],"takeaway":"方法论文的另一种切入：先证伪现有工具，再缩小问题定义（已知突变的细胞归属），用更严的错误控制换取可信的单细胞基因型。"},{"id":"yizhak2019","year":2019,"authors":"Yizhak, Aguet, Kim, et al.","short":"Yizhak et al.","title":"RNA sequence analysis reveals macroscopic somatic clonal expansion across normal tissues","titleZh":"RNA-MuTect：从 bulk RNA-seq 识别体细胞突变（方法前体）","journal":"Science","doi":"10.1126/science.aaw0726","pmid":"31171664","kind":"precursor","tool":"RNA-MuTect","oneLiner":"不是单细胞论文，但是 scRNA 体细胞检测的直接前体：必须把 RNA editing、胚系位点、等位基因表达偏倚与体细胞突变切开。","structure":[{"n":"00","title":"Biological claim","note":"正常组织存在宏观克隆扩增；RNA-seq 可以在 GTEx 规模上观察。"},{"n":"01","title":"Method","note":"RNA-MuTect：RNA 候选位点对照配对 DNA，过滤 editing 与 germline。"},{"n":"02","title":"Validation","note":"与 DNA 测序交叉验证，讨论组织与年龄相关的突变负荷。"}],"comparedTo":["DNA 配对对照","RNA editing 数据库"],"metricsUsed":["与 DNA 的一致性","突变负荷","克隆扩增"],"angles":["RNA 特有噪声源的分类（editing / germline / ASE）","配对 DNA 作为金标准","生物学终点是克隆扩增而非 caller 排名"],"datasets":["GTEx bulk RNA-seq","配对 DNA"],"groundTruth":"配对 DNA 测序。","howTheyCompare":"不以工具竞赛为主，而以「RNA 候选 vs DNA 证实」定义真阳性。后续 SComatic / RESA 的过滤清单（editing、多态、panel of normals）几乎都从这条思路继承。","numbers":[{"label":"数据类型","value":"bulk RNA"},{"label":"对照","value":"配对 DNA"}],"keyFindings":["RNA-seq 可以回收外显子体细胞突变，但必须显式处理 RNA editing 与等位基因偏倚。","为单细胞方法提供了噪声本体：假阳性主要不是「没对齐」，而是生物学/分子噪声类别。"],"takeaway":"写 scRNA 突变论文时，引言几乎都会经过 RNA-MuTect：先承认 RNA 能看到突变，再指出单细胞使问题难一个数量级。"},{"id":"zhou2020","year":2020,"authors":"Zhou, Xu, Minn, Zhang","short":"Zhou et al.","title":"DENDRO: genetic heterogeneity profiling and subclone detection by single-cell RNA sequencing","titleZh":"DENDRO：用 scRNA-seq 做遗传异质性分析与亚克隆检测","journal":"Genome Biology","doi":"10.1186/s13059-019-1922-x","pmid":"31937348","kind":"method","tool":"DENDRO","github":"https://github.com/zhouzilu/DENDRO","oneLiner":"把「检出突变」改写成「用转录的点突变重建系统发育树」，评价指标从 F1 换成 ARI / capture / purity。","structure":[{"n":"00","title":"Problem shift","note":"承认 scRNA-seq 点突变检出不可靠，但亚克隆归属仍可能稳健——把任务从 variant calling 转到 phylogeny。"},{"n":"01","title":"Model","note":"Beta-Binomial 处理爆发式表达、技术 dropout 与测序错误，计算细胞间遗传距离。"},{"n":"02","title":"Benchmark","note":"模拟数据 + 有已知亚群标签的转移性肾细胞癌。报告聚类准确率，对比既有方法。"},{"n":"03","title":"Application","note":"小鼠黑色素瘤免疫治疗：用亚克隆解释新抗原与治疗反应。"},{"n":"04","title":"DENDROplan","note":"实验设计工具：给定树结构、细胞数、深度，预测 ARI。"}],"comparedTo":["基于表达的聚类","既有遗传距离方法"],"metricsUsed":["ARI","Capture rate","Purity","Clustering accuracy"],"angles":["下游任务替代上游检出：克隆树比单个 SNV 更可评估","统计噪声模型（Beta-Binomial）作为方法卖点","基因型与转录组在同一批细胞上联合解读"],"datasets":["模拟 scRNA-seq","转移性肾细胞癌（已知亚群）","小鼠黑色素瘤免疫治疗"],"groundTruth":"模拟的真实树；真实数据中的已知亚群标签。","howTheyCompare":"比较对象不是 GATK 一类 caller，而是亚克隆检测/聚类方法。用调整兰德指数衡量全局正确性，用 capture 与 purity 衡量每个亚克隆。DENDROplan 进一步把比较推到实验设计层（细胞数 × 深度）。","numbers":[{"label":"癌症类型","value":"3"},{"label":"核心模型","value":"Beta-Binomial"},{"label":"主指标","value":"ARI"}],"keyFindings":["在已知亚群的肾癌数据上，遗传距离聚类优于纯表达聚类。","同一细胞同时有突变谱与表达谱，才能把新抗原与治疗反应连起来。"],"takeaway":"如果你的方法终点是生物学（克隆、治疗），论文结构会把 benchmark 放在「任务指标」上，变异检出只是中间产物。"},{"id":"prashant2021","year":2021,"authors":"Prashant, Liu, Zhang, et al.","short":"Prashant et al.","title":"SCReadCounts: estimation of cell-level SNVs from scRNA-seq data","titleZh":"SCReadCounts：从 scRNA-seq 估计细胞水平 SNV 读数","journal":"BMC Genomics","doi":"10.1186/s12864-021-07974-8","kind":"method","tool":"SCReadCounts","oneLiner":"不宣称自己是 somatic caller，而是提供细胞×位点的 ref/alt 计数与 VAFRNA 矩阵，供已知突变或发现模式使用。","structure":[{"n":"00","title":"Tool paper 结构","note":"输入（barcode BAM + 位点列表）→ 输出矩阵 → 三个应用案例。这是典型的 software/resource 文章骨架。"},{"n":"01","title":"Applications","note":"（1）已知体细胞突变与 RNA editing 的细胞表达；（2）双等位基因位点的等位表达；（3）无先验的 discovery 模式。"},{"n":"02","title":"Case study","note":"7 个神经母细胞瘤、59,884 个细胞，COSMIC 位点回收。"}],"comparedTo":["对合并 BAM 做 variant calling（概念对比）"],"metricsUsed":["检出突变数","细胞覆盖","VAFRNA","minR"],"angles":["量化工具 vs 判定工具","低比例细胞中的体细胞/嵌合 SNV 会被合并 calling 漏掉","把「无表达」与「纯参考等位基因」区分开"],"datasets":["神经母细胞瘤 7 样本 / 59,884 细胞"],"groundTruth":"COSMIC 注释的已知体细胞突变。","howTheyCompare":"几乎不做 F1 竞赛。论证方式是：合并比对的 variant calling 会漏掉只在少数细胞出现的位点；细胞水平计数能找回。SComatic 后来把它当作「单细胞特异方法」基线之一。","numbers":[{"label":"细胞数","value":"59,884"},{"label":"COSMIC 回收","value":"450"},{"label":"默认 minR","value":"3"}],"keyFindings":["在至少 4 个细胞中检出 450 个不同的 COSMIC 突变。","发现模式不需要先验 VCF，但对假阳性没有 SComatic/RESA 那样的统计闸门。"],"takeaway":"工具论文可以靠「矩阵作为中间件」成立；后续方法论文会把它重新放进 caller 排行榜，此时它往往敏感度高、精度低。"},{"id":"huang2021","year":2021,"authors":"Huang, Huang","short":"Huang & Huang","title":"Cellsnp-lite: an efficient tool for genotyping single cells","titleZh":"cellsnp-lite：高效的单细胞双等位基因分型","journal":"Bioinformatics","doi":"10.1093/bioinformatics/btab358","kind":"method","tool":"cellsnp-lite","github":"https://github.com/single-cell-genetics/cellsnp-lite","oneLiner":"不算 somatic caller，却是半个领域的基础设施：输出细胞×位点的等位基因计数，供 demux、Numbat、克隆 mtDNA 使用。","structure":[{"n":"00","title":"Software note","note":"短文结构：动机（速度/内存）→ 四种 mode（给定 SNP vs 发现；10x vs SMART-seq）→ 与 cellSNP 一致性。"},{"n":"01","title":"Contract","note":"明确警告 mode 2 会输出体细胞或 RNA editing 假阳性，不适合直接当 somatic 结果。"}],"comparedTo":["cellSNP","pysam pileup"],"metricsUsed":["速度","内存","与 cellSNP 一致性"],"angles":["中间件论文：比较的是工程指标，不是 F1","把「分型」从「判定体细胞」里拆出去"],"datasets":["10x / SMART-seq 示例"],"groundTruth":"与 cellSNP 的一致性，而非体细胞金标准。","howTheyCompare":"几乎不做 somatic 精度评估。后续 Numbat、SComatic 流水线把它当 pileup 前端。","numbers":[{"label":"体裁","value":"Application Note"},{"label":"模式","value":"4"}],"keyFindings":["给定 SNP 列表时高效稳健；全基因组发现模式会混入体细胞与 editing。","输出矩阵直接对接 vireo / Numbat / MQuad。"],"takeaway":"写方法论文时要把「pileup 工具」和「somatic caller」分开比较，否则你会把 cellsnp-lite 错放进 F1 表。"},{"id":"qin2022","year":2022,"authors":"Qin, Van Nostrand, Zhou, Yeo","short":"Qin et al.","title":"scAllele: A versatile tool for the detection and analysis of variants in scRNA-seq","titleZh":"scAllele：scRNA-seq 变异与等位基因特异性剪接","journal":"Science Advances","doi":"10.1126/sciadv.abn6398","kind":"method","tool":"scAllele","oneLiner":"读段级检出 SNV 与微 indel，并把它连到等位基因特异性剪接。比较的是变异检出 + 剪接连锁，不只是体细胞 F1。","structure":[{"n":"00","title":"Caller + phenotype","note":"先证明低覆盖下 SNV/indel 优于常用工具，再展示独特能力：变异等位基因与剪接异构体的连锁。"},{"n":"01","title":"Cancer application","note":"肺癌 Smart-seq2：部分连锁事件在癌细胞特异、富集癌症通路。"}],"comparedTo":["常用 SNV caller（文中 head-to-head）"],"metricsUsed":["SNV/indel 检出性能","等位基因–剪接关联"],"angles":["把变异从基因型延伸到 RNA 表型","读段级 haplotype 过滤（含 editing）"],"datasets":["肺癌 Smart-seq2（TH179 / TH238，574 细胞）"],"groundTruth":"模拟与常用工具对照；生物学以剪接连锁为准。","howTheyCompare":"强调低覆盖与微 indel，以及别人做不到的等位基因特异性剪接，而不是与 SComatic 同期 F1。","numbers":[{"label":"细胞","value":"574"},{"label":"患者","value":"2"}],"keyFindings":["读段级 calling 有利于稀有/体细胞位点。","部分变异–剪接连锁为癌细胞特异。"],"takeaway":"切入可以是「同一变异的功能读出」，不一定是更高的 somatic F1。"},{"id":"gao2022","year":2022,"authors":"Gao, Bi, Li, et al.","short":"Gao et al.","title":"Haplotype-aware analysis of somatic copy number variations from single-cell transcriptomes","titleZh":"Numbat：单倍型感知的 scRNA-seq 体细胞拷贝数分析","journal":"Nature Biotechnology","doi":"10.1038/s41587-022-01468-y","kind":"method","tool":"Numbat","github":"https://github.com/kharchenkolab/numbat","oneLiner":"SNV caller 的平行世界：用群体相位 + 表达 + 等位基因重建体细胞 CNA 与肿瘤克隆树。SComatic 自己也用它做克隆对照。","structure":[{"n":"00","title":"Joint model","note":"表达倍数、BAF、群体单倍型、亚克隆进化迭代推断。"},{"n":"01","title":"Benchmark","note":"22 个肿瘤样本；与 WGS 拷贝数剖面并置；恶性/正常分类 vs CopyKAT。"}],"comparedTo":["CopyKAT","表达-only 模型","配对 WGS"],"metricsUsed":["恶性/正常分类准确率","与 WGS 剖面一致性","亚克隆恢复"],"angles":["CNA 是另一类「从 scRNA 读体细胞突变」","单倍型把等位基因不平衡变成可计算信号"],"datasets":["骨髓瘤、胃、乳腺、甲状腺等 22 样本"],"groundTruth":"配对 WGS 拷贝数；已知正常细胞。","howTheyCompare":"与 CopyKAT 等比恶性细胞分类和 CNA 剖面，而不是 SNV F1。后续独立基准（2025）仍把 Numbat 列为多数任务第一。","numbers":[{"label":"肿瘤样本","value":"22"},{"label":"对照","value":"WGS"}],"keyFindings":["联合模型优于纯表达。","可在微环境中精确识别恶性细胞并重建克隆。"],"takeaway":"完整调研必须把 CNA 家族写进去：许多「scRNA 体细胞」论文实际比较的是 Numbat，不是 GATK。"},{"id":"xu2022","year":2022,"authors":"Xu, Zhou, Wang, et al.","short":"Xu et al.","title":"Identification of Somatic Mutations From Bulk and Single-Cell Sequencing Data","titleZh":"从 bulk 与单细胞测序数据鉴定体细胞突变（综述）","journal":"Frontiers in Genetics","doi":"10.3389/fgene.2022.802802","kind":"review","oneLiner":"把 DNA / RNA、bulk / 单细胞 caller 放进一张特征表：测序类型、突变类型、是否需要配对对照、是否对非癌优化。","structure":[{"n":"00","title":"Taxonomy","note":"按数据模态切：bulk DNA、scDNA、bulk RNA、scRNA。这是综述最有用的结构决策。"},{"n":"01","title":"Tool table","note":"每个工具一行：可检测突变、是否需要 matched control、是否 joint calling、是否 base-quality aware。"},{"n":"02","title":"scRNA 专节","note":"明确写出当时的限制：多数 scRNA 分析只能「回捕」DNA 已发现的突变（如 SCmut），de novo 仍稀缺。"}],"comparedTo":["Strelka","VarScan2","Monovar","SCAN-SNV","RNA-MuTect","SCmut"],"metricsUsed":["定性能力表（非数值 F1）"],"angles":["能力矩阵比排行榜更适合综述","「是否需要配对对照」是第一分类轴","mtDNA 作为谱系标记的旁路"],"datasets":["文献汇编"],"groundTruth":"不适用；综述不产生新金标准。","howTheyCompare":"比较的是工具契约（输入、输出、假设），不是在同一数据集上的分数。这种「特征表」后来被方法论文的 Table 1 反复模仿。","numbers":[{"label":"比较方式","value":"能力表"},{"label":"主分类轴","value":"模态 × 对照"}],"keyFindings":["scRNA 体细胞检测在 2022 年仍主要是 DNA 突变的再捕获。","线粒体突变是当时少数能在 scRNA/scATAC 上稳健用作谱系标记的信号。"],"takeaway":"综述文章用分类学而非 F1 来比较；你若写 review，一张「输入假设表」比十张柱状图更清楚。"},{"id":"zhang2023","year":2023,"authors":"Zhang, Jia, Song, et al. (Shen lab)","short":"Zhang et al.","title":"De novo identification of expressed cancer somatic mutations from single-cell RNA sequencing data","titleZh":"RESA：从 scRNA-seq de novo 鉴定表达的癌症体细胞突变","journal":"Genome Medicine","doi":"10.1186/s13073-023-01269-1","pmid":"38111063","kind":"method","tool":"RESA","github":"https://github.com/ShenLab-Genomics/RESA","oneLiner":"精度优先的 de novo 框架：双 pipeline 共识 + 跨细胞复发 + 联合逻辑回归。F0.5 作为主指标，公开承认敏感度是次要的。","structure":[{"n":"00","title":"Abstract 公式","note":"问题（de novo 难）→ 方法名 → 关键数字（precision 0.77 / 19 数据集）→ 一个生物学应用（黑色素瘤耐药）。"},{"n":"01","title":"Algorithm (3 stages)","note":"① 两组独立 mapping + calling 降 pipeline bias；② 按跨细胞复发分成高可信突变 / 噪声 / 待判；③ 联合逻辑回归扩大敏感度。"},{"n":"02","title":"Spike-in","note":"人胰腺 >800 细胞的 in silico spike-in，先在可控假阳性下报 precision。"},{"n":"03","title":"Cell line + PDX vs WES","note":"15 细胞系 + 4 PDX，WES 作金标准。与五种已发表流程比 precision / sensitivity / F0.5。"},{"n":"04","title":"Application","note":"黑色素瘤耐药时间序列，回收 BRAF V600E，做瘤内异质性。"}],"comparedTo":["Enge 2017","Maynard 2020","Hovestadt 2019","BCFtools","VarScan","RESA-jLR（自身消融）"],"metricsUsed":["Precision","Sensitivity","F0.5","AUC","VAF correlation"],"angles":["精度是瓶颈：现有方法不是找不到位点，而是假阳性淹没","F0.5 而不是 F1：显式把权重偏向 precision","双 pipeline 共识对抗比对/caller 偏差","细胞系（高 VAF、克隆）→ PDX → 原发肿瘤，难度递增"],"datasets":["3 个 spike-in 组织","15 癌症细胞系 scRNA-seq + 配对 WES","4 个 PDX","黑色素瘤耐药 scRNA-seq"],"groundTruth":"配对 WES；spike-in 植入位点；部分与 bulk RNA-seq 的 VAF 相关。","howTheyCompare":"对所有方法施加相似的过滤参数。金标准是 WES 体细胞 SNV，但只在 scRNA 可覆盖位点上计分。主图是 15 数据集的 precision/sensitivity 箱线，以及 F0.5 散点。自身消融 RESA vs RESA-jLR：回归器提高敏感度、略降精度。","numbers":[{"label":"Spike-in 均精度","value":"0.77"},{"label":"三基线精度","value":"0.84 / 0.87 / 0.87"},{"label":"15 数据集均精度","value":"0.75"},{"label":"jLR 均 AUC","value":"0.90"},{"label":"黑色素瘤突变","value":"575"}],"keyFindings":["在 15 个细胞系上精度显著高于五种基线方法。","jLR 用高可信突变作正例、高可信噪声作负例，AUC 0.79–0.98。","应用中找回 BRAF V600E，并追踪治疗时间点的突变–表达关系。"],"takeaway":"标准「新方法」论文模板：示意图 → 模拟/spike-in → 配对 DNA 金标准大表 → 自身消融 → 一个能讲故事的肿瘤应用。指标选择（F0.5）本身就是论点。"},{"id":"muyas2024","year":2024,"authors":"Muyas, Sauer, Valle-Inclán, Li, Rahbari, Mitchell, Hormoz, Cortes-Ciriano","short":"Muyas et al.","title":"De novo detection of somatic mutations in high-throughput single-cell profiling data sets","titleZh":"SComatic：无需配对 DNA，从 scRNA-seq / scATAC-seq de novo 检测体细胞突变","journal":"Nature Biotechnology","doi":"10.1038/s41587-023-01863-z","pmid":"37414936","kind":"method","tool":"SComatic","github":"https://github.com/cortes-ciriano-lab/SComatic","oneLiner":"当前引用锚点。细胞类型聚合 + Beta-Binomial + 正常 panel + RNA editing 过滤。F1 0.6–0.7，第二名 0.2–0.4。","structure":[{"n":"00","title":"Introduction","note":"单细胞分辨率的体细胞突变对癌症进化、克隆镶嵌、细胞可塑性是必要的；现有方法在分化细胞与多克隆组织上失败。"},{"n":"01","title":"Algorithm overview (Fig. 1)","note":"按细胞类型堆 reads → 记录 alt 在细胞类型间的出现 → Beta-Binomial 相对背景噪声 → 去多态、去 editing、PoN、深度过滤。"},{"n":"02","title":"Accuracy vs matched WGS/WES","note":"cSCC、卵巢癌、肾癌。只在 RNA 可调用位点上计算 sensitivity / precision / F1。"},{"n":"03","title":"Head-to-head (Fig. 3)","note":"Strelka2、SAMtools、VarScan2、Monovar、SCReadCounts。50 次 bootstrap + t 检验。"},{"n":"04","title":"Biological concordance","note":"突变谱与 WES 的 cosine；COSMIC 签名（SBS7 UV、MMRd）；突变负荷 vs TCGA。"},{"n":"05","title":"Applications","note":"克隆异质性热图、单细胞突变负荷、非肿瘤细胞的突变过程。"},{"n":"06","title":"Discussion","note":"承认稀疏与深度限制；强调无需配对样本这一点打开了分化细胞与多克隆组织。"}],"comparedTo":["Strelka2","SAMtools","VarScan2","Monovar","SCReadCounts"],"metricsUsed":["Sensitivity","Precision","F1","Cosine similarity","Mutational signatures","Mutation burden"],"angles":["无需配对 DNA / 正常样本","细胞类型是突变的自然聚合单位（同一分化轨迹）","精度碾压式领先，敏感度并不总是最高——用 F1 做权衡","生物学一致性作为第二裁判：签名与负荷必须像 DNA","把方法推广到 scATAC，证明不是 RNA 特化 hack"],"datasets":["cSCC scRNA-seq + 配对 WES","卵巢癌、肾癌","结直肠 MSI/MSS/POLE","Heart Cell Atlas、GTEx","688 个 scRNA/scATAC 数据集，>260 万细胞"],"groundTruth":"配对基因组测序的体细胞突变；评估限制在 scRNA 有覆盖（至少 1 read）的位点。50× bootstrap 得置信区间。","howTheyCompare":"基线按 Liu 2019 的「scRNA 上表现最好的 bulk pipeline」来选，再加上两个单细胞工具。所有 caller 在可比的最小 alt 支持（3 reads）下运行。主图并排敏感度/精度/F1。次图用突变谱 cosine 与签名分解，防止「高 F1 但生物学荒谬」。统计：双侧 t 检验，FDR 校正。","numbers":[{"label":"F1","value":"0.6–0.7"},{"label":"第二名 F1","value":"0.2–0.4"},{"label":"Precision","value":"0.67–0.87"},{"label":"Strelka2 precision","value":"0.06–0.24"},{"label":"Sensitivity","value":"0.33–0.56"},{"label":"SBS7 cosine","value":"0.98"}],"keyFindings":["Strelka2 / VarScan2 / SCReadCounts 敏感度可以更高，但精度崩溃，F1 被 SComatic 大幅超过。","cSCC 中 77% 突变归到 SBS7a–d，与 WES 谱 cosine 0.98。","可以在没有配对 DNA 的分化细胞、多克隆组织中估计突变负荷与签名。"],"takeaway":"目前的方法论文黄金模板：大队列规模数字 + 三数据集 F1 柱状图 + 签名 cosine 作为生物学质控 + 一个「以前做不到」的组织类型。后续 LongSom 与批判预印本都以它为对照。"},{"id":"dou2024","year":2024,"authors":"Dou, Tan, Sun, et al.","short":"Dou et al.","title":"Single-nucleotide variant calling in single-cell sequencing data with Monopogen","titleZh":"Monopogen：利用连锁不平衡从单细胞数据检出 SNV","journal":"Nature Biotechnology","doi":"10.1038/s41587-023-01873-x","pmid":"37592035","kind":"method","tool":"Monopogen","oneLiner":"把群体遗传学搬进单细胞：用参考面板 LD 救稀疏覆盖下的胚系分型，再用细胞群体共分离找体细胞。","structure":[{"n":"00","title":"Two-module design","note":"模块一：胚系（与 1KG 等面板重叠，LD 精炼，95% 分型准确）。模块二：体细胞（SVM 去低质量 + 细胞群体 LD 精炼）。"},{"n":"01","title":"Germline accuracy","note":"与配对 WGS 比 genotyping accuracy、检出数量（100K–3M）。"},{"n":"02","title":"Somatic module","note":"期望：除亚群中体细胞改变的位点外，等位基因与邻近位点完美 LD。违反者即候选体细胞。"},{"n":"03","title":"Applications","note":"祖先推断、心肌代谢相关变异、图谱规模队列。"}],"comparedTo":["配对 WGS 金标准","Monovar（簇水平新位点）"],"metricsUsed":["Genotyping accuracy","SNV count","Ancestry inference"],"angles":["稀疏短读不是信息不足，而是需要外部 LD","胚系与体细胞必须拆成两个统计问题","平台无关：scRNA / snRNA / scATAC / scDNA","体细胞是「打破 LD 的位点」，不是简单的 alt 计数"],"datasets":["视网膜、正常乳腺、亚洲免疫图谱","配对 WGS 子集"],"groundTruth":"配对全基因组测序的胚系基因型；体细胞为 putative，用共分离与 SVM 约束。","howTheyCompare":"胚系部分有硬金标准（WGS 一致性）。体细胞部分更审慎，报的是数量级（hundreds）与生物学可用性，而不是对 SComatic 的 F1 对打。用 Monovar 做簇水平新 SNV 的后端。","numbers":[{"label":"胚系 SNV","value":"100K–3M"},{"label":"分型准确率","value":"95%"},{"label":"体细胞数量级","value":"数百"}],"keyFindings":["10x scRNA/snRNA 可召回 100K–1M 胚系 SNV，scATAC 1–2.5M，准确率 >0.95。","细胞群体水平的 LD 精炼能把稀疏短读里的体细胞候选从噪声里拉开。"],"takeaway":"同一年 Nat Biotech 的另一条路：不跟 SComatic 抢 F1，而是证明单细胞数据里藏着可用的群体遗传信号。比较角度是「分型准确率 + 规模」，不是 precision-recall。"},{"id":"dondi2025","year":2025,"authors":"Dondi, Borgsmüller, Ferreira, Haas, Jacob, Heinzelmann-Schwarz, Beerenwinkel","short":"Dondi et al.","title":"De novo detection of somatic variants in high-quality long-read single-cell RNA sequencing data","titleZh":"LongSom：高质量长读长 scRNA-seq 的 de novo 体细胞变异检测","journal":"Genome Research","doi":"10.1101/gr.279281.124","pmid":"40107722","kind":"method","tool":"LongSom","github":"https://github.com/cbg-ethz/LongSom","oneLiner":"把 SComatic 思路迁到长读长，并加上细胞类型重注释、融合、CNA、mtSNV，用 scWGS 做金标准直接挑战 SComatic。","structure":[{"n":"00","title":"Overview","note":"输入 BAM + 细胞类型 → 用突变谱重注释细胞类型 → 调 SNV/mtSNV/融合/CNA → BnpC 重建克隆。"},{"n":"01","title":"Why reannotation","note":"错误的细胞类型会让体细胞位点被当成胚系过滤。重注释可提升敏感度至 31%。"},{"n":"02","title":"vs SComatic (Fig. 5)","note":"同一长读长数据上对打：Venn、scWGS 支持、precision / sensitivity / F1。"},{"n":"03","title":"LR vs SR","note":"同一批细胞的短读 vs 长读：短读 SComatic 只得到 114 个位点，约为长读的 1/7.3，交集仅 9。"},{"n":"04","title":"Clinical readout","note":"SNV+融合定义的亚克隆有不同的预测治疗结局。"}],"comparedTo":["SComatic","scWGS","短读 scRNA-seq","inferCNV"],"metricsUsed":["Precision","Sensitivity","F1","Call overlap","scWGS support","Clone recovery"],"angles":["直接挑战领域锚点方法（SComatic）","细胞类型错误是假阴性来源，不是小预处理细节","长读长同时给 SNV、融合、CNA，克隆重建不再只靠点突变","金标准升级为 scWGS，而不只是 bulk WES"],"datasets":["3 例高级别浆液性卵巢癌，同一细胞的 LR + SR scRNA-seq + scWGS"],"groundTruth":"匹配的 scWGS / panel；评估时要求 scRNA 至少 1 read 覆盖。","howTheyCompare":"为公平，把 LongSom 的 10 kb 簇过滤也加到 SComatic 上。报告每患者 Venn（重叠 40–72%）。对 scWGS 支持的位点算 precision 0.44–0.5 vs 0.41–0.46，sensitivity 0.19–0.55 vs 0–0.13。再用短读对照证明模态本身限制检出。","numbers":[{"label":"Precision","value":"0.44–0.50"},{"label":"Sensitivity","value":"0.19–0.55"},{"label":"vs SComatic 敏感度","value":"0–0.13"},{"label":"SR 位点","value":"114（×1/7.3）"},{"label":"重注释增益","value":"+31%"}],"keyFindings":["精度与 SComatic 相近，敏感度显著更高，主因是细胞类型重注释避免把体细胞当胚系丢掉。","长短读交集极小，说明短读 scRNA 的可检测突变集合本身很窄。","SNV+融合足以恢复与 scWGS 一致的亚克隆。"],"takeaway":"2025 年的比较已经从「对 GATK」升级到「对 SComatic」。结构上多了 Venn、模态对比（LR/SR）和克隆一致性，F1 不再是唯一语言。"},{"id":"nrc2025","year":2025,"authors":"Nature Reviews Cancer · Tools of the Trade","short":"Nat Rev Cancer","title":"Detecting somatic mutations in single-cell data with SComatic","titleZh":"用 SComatic 在单细胞数据中检测体细胞突变（工具评介）","journal":"Nature Reviews Cancer","doi":"10.1038/s41568-025-00799-7","kind":"review","tool":"SComatic","oneLiner":"用两栏篇幅把 SComatic 的关键假设写清楚：同一分化轨迹、细胞类型聚合、PoN、editing 清单。","structure":[{"n":"00","title":"Problem list","note":"稀疏、胚系污染、表达导致的深度不均、RNA editing、伪差。"},{"n":"01","title":"How the algorithm answers each","note":"一对一映射：轨迹假设→按细胞类型堆 reads；假阳性→多态/editing/PoN/深度。"}],"comparedTo":["概念上的既有 SNV caller"],"metricsUsed":["定性"],"angles":["把方法的假设写成可证伪的清单——这正是后续批判文章的切入点"],"datasets":["指向 Muyas 2024"],"groundTruth":"不适用。","howTheyCompare":"不比较分数，比较「挑战–对策」配对。适合作为写 Introduction 的提纲。","numbers":[{"label":"体裁","value":"Tools of the Trade"}],"keyFindings":["核心假设：大多数体细胞突变发生在同一分化轨迹的细胞类型中。","假阳性被拆成几类独立过滤器，而不是一个黑盒分数。"],"takeaway":"短评型文章的价值是把长文的假设提取出来，方便你在自己的论文里引用或反驳。"},{"id":"esophagus2026","year":2026,"authors":"bioRxiv survey in the esophagus","short":"Esophagus survey","title":"Somatic mutation inference from single-cell transcriptomics: A survey in the esophagus","titleZh":"从单细胞转录组推断体细胞突变：食管调查（对 SComatic 的实证压力测试）","journal":"bioRxiv","doi":"10.64898/2026.07.07.737010","kind":"critique","tool":"SComatic","oneLiner":"按官方流程跑 SComatic 后，用同窝小鼠 / 同一供体多活检做对照，发现大部分「可接受」变异其实是未滤净的 SNP 或文库共有伪差。","structure":[{"n":"00","title":"Reproduce then stress-test","note":"先承认 SComatic 是目前最稳健的工具，再设计正交对照检验其假阳性。"},{"n":"01","title":"Orthogonal germline control","note":"小鼠同窝、人类同一供体多活检：跨文库共享的位点更像 SNP/伪差，而不是体细胞。"},{"n":"02","title":"Database intersection","note":"约 30% 与 dbSNP 且在 1KG/gnomAD 有频率的位点重叠。"},{"n":"03","title":"Rescue the rest","note":"额外过滤后约 70% 可视为较可信体细胞；未知位点的克隆大小与基因结构类似已知体细胞。"}],"comparedTo":["SComatic 原论文数字","dbSNP / gnomAD / 1KG"],"metricsUsed":["跨个体共享率","dbSNP 重叠","克隆大小","基因结构注释"],"angles":["原论文 F1 可能高估：金标准与过滤都在同一分子逻辑里","跨样本共享是检测 germline 泄漏的廉价正交轴","内含子/基因间突变比例高不一定是伪差（scATAC 也有）"],"datasets":["小鼠同窝对照","人类供体多活检食管 scRNA-seq"],"groundTruth":"跨个体/跨活检共享；群体数据库。不是第二套 WGS。","howTheyCompare":"不重跑 Liu 的七个 caller，而是对「当前最佳」做外部效度检验。比较的值从 F1 换成共享率与数据库重叠。这是批判/复现文章的典型切入。","numbers":[{"label":"dbSNP 可疑比例","value":"~30%"},{"label":"过滤后可信","value":"~70%"},{"label":"原论文 DNA 回收","value":"40–70%"}],"keyFindings":["按官方教程得到的位点，大部分仍可能是 SNP 或扩增/测序伪差。","即使如此，SComatic 仍被当作目前最可用的起点，只是必须加跨样本对照。"],"takeaway":"领域进入第二阶段：新文章可以不再发明 caller，而是压力测试现有 caller。比较角度从「谁 F1 高」变成「假阳性从哪类生物学对照里漏出来」。"}],"metrics":[{"name":"Sensitivity / TPR / Recall","what":"金标准突变中被召回的比例。scRNA 评估必须限制在 RNA 可覆盖位点，否则深度稀疏会把所有方法打到接近 0。","usedBy":["Liu 2019","SComatic","RESA","LongSom"]},{"name":"Precision / PPV","what":"所报突变中为真的比例。scRNA 的主战场：bulk caller 敏感度可以很高，精度可以低到 0.06。","usedBy":["SComatic","RESA","LongSom"]},{"name":"F1","what":"精度与敏感度的调和平均。SComatic 用它宣布全面领先（0.6–0.7 vs 0.2–0.4）。","usedBy":["SComatic","LongSom"]},{"name":"F0.5","what":"把权重偏向精度的 F 分数。RESA 选用它，等于在方法论文里声明：假阳性比假阴性更不可接受。","usedBy":["RESA"]},{"name":"FDR / FPR","what":"假发现率 / 假阳性率。Liu 与 SCmut 的早期语言；在没有完整金标准时更自然。","usedBy":["Liu 2019","SCmut"]},{"name":"AUC","what":"分类器在阈值扫描下的整体分辨力。RESA 的联合逻辑回归用 hold-out AUC 0.79–0.98 证明过滤器可学习。","usedBy":["RESA"]},{"name":"Cosine similarity of spectra","what":"96 通道三核苷酸谱与 DNA 金标准或 COSMIC 签名的几何一致性。用来防止「统计上对、生物学上不像突变」。","usedBy":["SComatic"]},{"name":"Mutation burden","what":"每细胞或每细胞类型每兆碱基突变数，与 TCGA / 配对 WES 对照。","usedBy":["SComatic"]},{"name":"Genotyping accuracy","what":"与 WGS 基因型一致的比例。Monopogen 的主指标，针对胚系而不是体细胞。","usedBy":["Monopogen"]},{"name":"ARI / Capture / Purity","what":"亚克隆重建质量。DENDRO 把比较从位点级改到细胞分区级。","usedBy":["DENDRO","LongSom / BnpC"]},{"name":"Call overlap / Venn","what":"方法之间一致性。低重叠（LongSom vs SComatic 40–72%）本身就是结果：caller 仍在抓不同的真/假集。","usedBy":["LongSom"]},{"name":"Cross-sample sharing","what":"跨个体或跨活检的位点共享率。高共享暗示 germline 泄漏或批次伪差。批判文章的核心度量。","usedBy":["Esophagus 2026"]}],"angles":[{"n":"01","title":"问题改写","en":"Task reformulation","body":"同一份 scRNA-seq，可以被写成四个不同问题：（1）de novo 发现体细胞 SNV；（2）把 bulk DNA 已有突变基因型化到细胞；（3）重建亚克隆树；（4）估计突变负荷与签名。论文的比较对象、指标、金标准全部由这个问题选择决定。SCmut 选（2），DENDRO 选（3），SComatic/RESA 选（1），Monopogen 把（1）拆成胚系+体细胞。"},{"n":"02","title":"精度 vs 敏感度","en":"Precision as the bottleneck","body":"Liu 2019 已经显示 bulk caller 在读数足够时 TPR 可以 >99%。真正崩掉的是精度。因此 2023–2024 的方法论文把叙事改成：我们愿意牺牲敏感度（SComatic 0.33–0.56，低于 Strelka2）来换 0.67–0.87 的精度。RESA 更进一步用 F0.5。写文章时，你需要显式说出你站在权衡曲线的哪一侧。"},{"n":"03","title":"金标准的构造","en":"Ground-truth engineering","body":"几乎从没有「全部体细胞突变」的真值。通行做法：配对 WES/WGS 的体细胞集合 ∩ RNA 可覆盖位点。这会系统性低估只在未表达区域的突变，也会把 DNA caller 的假阴性当成 RNA 的假阳性。LongSom 升级到 scWGS；批判文章改用跨个体共享。你必须在 Methods 写清 callable 的定义，否则 F1 不可比。"},{"n":"04","title":"噪声本体","en":"Error taxonomy","body":"高质量论文会先给假阳性分类，再为每一类设过滤器：胚系多态（dbSNP/gnomAD）、RNA editing（REDIportal 等）、比对伪差（双 pipeline、错配标签）、扩增/文库批次（PoN、跨样本共享）、细胞类型污染（LongSom 重注释）。比较可以按「哪一类 FP 被压掉」来做，而不是只报一个总分。"},{"n":"05","title":"聚合尺度","en":"Aggregation scale","body":"单细胞 pileup 太稀疏。SComatic 聚合到细胞类型；Monopogen 聚合到细胞群体 LD；RESA 看跨细胞复发；SCReadCounts 坚持细胞水平计数。聚合提高功效，但把细胞类型错误变成系统偏差——这正是 LongSom 重注释的切入点。"},{"n":"06","title":"生物学第二裁判","en":"Biological concordance","body":"即使 F1 领先，也要证明突变「看起来像该类肿瘤的突变」：UV 签名 SBS7、MMRd 签名、BRAF V600E、与 TCGA 相当的负荷、与 scWGS 一致的亚克隆。这能挡住「高精度但全是 RNA editing」的质疑，也让审稿人有非统计的抓手。"},{"n":"07","title":"输入契约","en":"Input contract","body":"是否需要配对 DNA，是第一分类轴。SCmut / RNA-MuTect 需要；SComatic / RESA / LongSom / Monopogen 宣称不需要。不需要对照的方法必须用 PoN、群体数据库或跨样本逻辑替代。比较时应把这一条写在 Table 1，而不是埋进 Discussion。"},{"n":"08","title":"模态与技术世代","en":"Modality leap","body":"短读 10x → SMART-seq → 长读长；scRNA → scATAC → scWGS。LongSom 用同一批细胞的 LR vs SR 证明：方法差距有时小于模态差距（7.3 倍位点差）。新论文可以用「新技术 + 旧问题」切入，而不必再发明一个短读 caller。"}],"structure":[{"n":"01","title":"Title / Abstract","body":"标题几乎都是 De novo detection/identification of somatic mutations from scRNA-seq。摘要四句：为何单细胞突变重要；现有方法失败在哪（假阳性 / 需要 DNA / 不能做分化细胞）；方法名 + 规模数字；一个关键分数（F1 或 precision）+ 一个生物学能力（签名、克隆、驱动突变）。"},{"n":"02","title":"Introduction","body":"固定三段论。（1）体细胞突变驱动癌症进化、镶嵌、可塑性。（2）scDNA 贵、扩增误差大、得不到同一细胞的转录组；scRNA-seq 已成常规，但稀疏、editing、等位基因脱落、表达偏倚、胚系污染。（3）Gap：或没有专用 caller，或精度不可用。最后一句预告本文贡献，通常恰好对应后面每一节 Results。"},{"n":"03","title":"Figure 1 · 算法概览","body":"几乎必有的示意图：BAM + 细胞类型 → 过滤阶梯 → 统计检验 → 输出 VCF/细胞基因型。审稿人用这张图判断方法是否只是「阈值堆叠」。把每一步对应到一种假阳性来源。"},{"n":"04","title":"Results A · 可控实验","body":"Spike-in 或模拟。目的不是宣称真实性能，而是证明在已知真值下过滤器按设计工作。RESA 的三组织 spike-in、Liu 的 reads/VAF 扫描、DENDRO 的树模拟都属于这一层。"},{"n":"05","title":"Results B · 配对 DNA 金标准","body":"核心比较节。选 2–3 个有 WES/WGS 的肿瘤数据集（细胞系容易、原发肿瘤难）。定义 callable 位点。对每个方法报 sensitivity / precision / F1，带 bootstrap 区间与统计检验。不要只给平均值。"},{"n":"06","title":"Results C · 生物学一致性","body":"突变谱 cosine、COSMIC 签名、驱动突变回收、负荷对照、克隆热图。这一节把「caller」变成「可以做生物学的工具」。"},{"n":"07","title":"Results D · 应用 / 以前做不到的事","body":"SComatic：分化细胞与多克隆组织。RESA：耐药时间序列。DENDRO：免疫治疗新抗原。LongSom：融合+SNV 的治疗分层。应用节决定文章能发到哪一档。"},{"n":"08","title":"Discussion","body":"先复述贡献，立刻写限制：只能看到表达区域；深度决定敏感度上限；细胞类型错误；germline 泄漏（现在审稿人会问）。给出适用边界：有/无配对 DNA、短读/长读、肿瘤/正常组织。"},{"n":"09","title":"Methods 里必须写清的比较协议","body":"基线版本与参数（最小 alt 支持要对齐）；金标准来源与 callable 定义；bootstrap / 检验；签名拟合时只使用该癌种已知过程（SComatic 的做法，避免过拟合 COSMIC 全集）。"}],"protocol":[{"n":"01","title":"选定任务","body":"de novo 发现、细胞分型、克隆树、还是突变负荷/签名。任务一变，基线、指标、金标准全部重选。"},{"n":"02","title":"构造金标准","body":"配对 WES/WGS ∩ RNA 可覆盖位点是主流。细胞系容易、原发肿瘤难。LongSom 把金标准升到 scWGS；批判文章改用跨样本共享。"},{"n":"03","title":"对齐输入契约","body":"同一 BAM、同一最小 alt 支持（常见 ≥3 reads / ≥2 cells）、同一 callable 定义。不对齐阈值，F1 不可比。"},{"n":"04","title":"分层报告","body":"不要只给一个总分。按 reads、VAF、外显子/内含子、癌种、短读/长读切开。Liu 2019 是这一条的原型。"},{"n":"05","title":"统计与消融","body":"bootstrap 区间、配对检验、FDR。自身消融（RESA vs RESA-jLR；LongSom 去重注释）证明每一步不是装饰。"},{"n":"06","title":"生物学第二裁判","body":"96 通道谱 cosine、COSMIC 签名、驱动突变回收、负荷对照、克隆与 scWGS 一致。挡住「统计上对、生物学上荒谬」。"}],"families":[{"id":"bulk-rna","title":"Bulk caller 迁到 scRNA","methods":"SAMtools, GATK, Strelka2, FreeBayes, VarScan2, MuTect2, CTAT","job":"位点发现","verdict":"敏感度可以很高，精度在 scRNA 上通常崩溃。Liu 2019 是基准，SComatic 把它变成反面教材。"},{"id":"genotype","title":"已知突变的细胞分型","methods":"SCmut, SCReadCounts","job":"把 DNA 已有位点投到细胞","verdict":"假阳性可控，但不能 de novo。需要配对 DNA 或位点列表。"},{"id":"denovo","title":"scRNA de novo SNV","methods":"RESA, SComatic, LongSom","job":"无配对 DNA 发现体细胞 SNV","verdict":"2023 年后的主战场。精度优先，F1 0.4–0.7 是目前公开区间。"},{"id":"ld","title":"群体遗传 / LD","methods":"Monopogen","job":"稀疏覆盖下的胚系分型 + 体细胞共分离","verdict":"比较语言是 genotyping accuracy 与规模，不是与 SComatic 对打 F1。"},{"id":"clone","title":"亚克隆 / 系统发育","methods":"DENDRO, BnpC","job":"细胞分区与进化树","verdict":"指标换成 ARI / capture / purity。突变检出只是中间产物。"},{"id":"cnv","title":"从表达推断体细胞 CNA","methods":"inferCNV, CopyKAT, HoneyBADGER, CaSpER, Numbat, SCEVAN","job":"拷贝数、恶性细胞鉴定、亚克隆","verdict":"与 SNV caller 平行的另一大家族。Numbat 在多组学金标准上总体领先；CopyKAT 在纯表达输入时更稳。"}],"cnv":[{"name":"inferCNV","year":"2016–","idea":"相对正常参考的表达平滑 → CNA","win":"亚克隆鉴定（单平台）","lose":"跨平台批次敏感"},{"name":"CopyKAT","year":"2021","idea":"整倍体核型，纯表达矩阵","win":"无等位基因时的默认选择；恶性/正常分类","lose":"拷贝中性 LOH 弱"},{"name":"HoneyBADGER","year":"2016","idea":"表达 + 等位基因 HMM","win":"早期方法学","lose":"稀有亚群、敏感度"},{"name":"CaSpER","year":"2020","idea":"多尺度表达 + BAF","win":"CNA 敏感度/特异度平衡","lose":"计算与参考选择敏感"},{"name":"Numbat","year":"2022","idea":"单倍型感知 HMM + 表达 + 等位基因 + 进化","win":"多数基准总分第一；cnLOH","lose":"需要群体相位信息"},{"name":"SCEVAN","year":"2022","idea":"自动恶性/正常 + 克隆断点","win":"克隆断点","lose":"肿瘤比例低时分类差"}],"howto":[{"n":"01","title":"先写 Table 1，再写算法","body":"列：工具、模态、de novo 与否、是否需配对 DNA、聚合尺度、主指标。审稿人 30 秒内知道你填的是哪一个空格。"},{"n":"02","title":"基线要分代","body":"2019 年对 GATK；2024 年对 SComatic；2025 年对 SComatic + 模态（LR/SR）。不要只打已经公认失败的 bulk caller。"},{"n":"03","title":"F1 不是唯一语言","body":"精度优先用 F0.5；克隆任务用 ARI；胚系用 genotyping accuracy；批判复现用跨样本共享率。指标选择本身就是论点。"},{"n":"04","title":"Callable 必须写进 Methods","body":"「配对 WES 的体细胞 ∩ scRNA ≥1 read」与「全基因组」是完全不同的分母。跨论文引用数字前先对齐分母。"},{"n":"05","title":"给假阳性一张分类表","body":"多态 / editing / 比对 / 批次 / 细胞类型。每一种对应一个过滤器，再做消融。比「我们过滤更严」更可审。"},{"n":"06","title":"第二裁判一定要有","body":"签名 cosine、驱动突变、负荷、克隆树。没有生物学一致性的 F1 领先，现在很难过审。"}],"noise":[{"n":"01","title":"胚系多态","filter":"dbSNP / gnomAD / 1KG 频率过滤；跨个体共享","papers":"全体 de novo 方法"},{"n":"02","title":"RNA editing","filter":"REDIportal 等 editing 清单；RNA-MuTect 起即列为独立噪声类","papers":"SComatic, RESA, RNA-MuTect"},{"n":"03","title":"比对 / 扩增伪差","filter":"双 aligner 共识、错配标签、同源区域、PoN、单碱基重复","papers":"RESA, SComatic"},{"n":"04","title":"文库批次","filter":"Panel of Normals；跨活检 / 同窝对照","papers":"SComatic, Esophagus 2026"},{"n":"05","title":"细胞类型污染","filter":"按细胞类型聚合前先重注释（突变谱）","papers":"LongSom"},{"n":"06","title":"表达稀疏与等位基因脱落","filter":"只在 callable 位点计分；Beta-Binomial；跨细胞复发","papers":"全体"}],"bench":[{"method":"SAMtools","role":"bulk pileup","precision":"低–中（视区域）","sensitivity":"最高之一","f1":"中","needsDna":"否","note":"Liu：低 reads 下最灵敏；内含子特异性差"},{"method":"Strelka2","role":"bulk somatic","precision":"0.06–0.24*","sensitivity":"高于 SComatic","f1":"0.2–0.4*","needsDna":"否（被这样跑）","note":"*SComatic 文中作为次优；读数充足时 Liu 认为稳定"},{"method":"VarScan2","role":"bulk somatic","precision":"低","sensitivity":"高，需更多 reads","f1":"低","needsDna":"常需配对","note":"敏感度高但 scRNA 假阳性多"},{"method":"Monovar","role":"scDNA","precision":"低","sensitivity":"低于 SComatic","f1":"低","needsDna":"否","note":"为扩增后的 scDNA 设计，迁到 RNA 不匹配"},{"method":"SCReadCounts","role":"scRNA 计数","precision":"低（发现模式）","sensitivity":"高","f1":"低","needsDna":"否","note":"本不是 caller；SComatic 基线中敏感度高"},{"method":"SCmut","role":"细胞分型","precision":"FPR 受控","sensitivity":"受限于 bulk 集合","f1":"—","needsDna":"是","note":"不能 de novo"},{"method":"RESA","role":"scRNA de novo","precision":"0.75–0.87","sensitivity":"中（jLR 提高）","f1":"F0.5 领先","needsDna":"否","note":"细胞系/PDX 上精度优先"},{"method":"SComatic","role":"scRNA/ATAC de novo","precision":"0.67–0.87","sensitivity":"0.33–0.56","f1":"0.6–0.7","needsDna":"否","note":"当前短读锚点方法"},{"method":"Monopogen","role":"胚系+体细胞","precision":"胚系 95% 一致","sensitivity":"胚系 100K–3M","f1":"未对打 SComatic","needsDna":"否（用 LD 面板）","note":"比较语言不同"},{"method":"LongSom","role":"长读 de novo","precision":"0.44–0.50","sensitivity":"0.19–0.55","f1":"高于 SComatic（同 LR）","needsDna":"否","note":"精度相近、敏感度更高；需长读"}],"stats":[{"k":"15","v":"核心文献"},{"k":"2019–2026","v":"时间跨度"},{"k":"06","v":"方法家族"},{"k":"12","v":"常用指标"}],"chart":[{"name":"SComatic","f1":0.65,"precision":0.77,"sensitivity":0.45},{"name":"Strelka2","f1":0.3,"precision":0.15,"sensitivity":0.62},{"name":"RESA","f1":0.55,"precision":0.75,"sensitivity":0.4},{"name":"LongSom","f1":0.48,"precision":0.47,"sensitivity":0.37},{"name":"SAMtools","f1":0.28,"precision":0.18,"sensitivity":0.58},{"name":"Monovar","f1":0.2,"precision":0.12,"sensitivity":0.25}],"kinds":{"method":"方法","benchmark":"基准","review":"综述","critique":"复现/批判","precursor":"前体"}};

function paperPage(p){

      <div class="sec-k"><a class="btn" href="#/">← Index</a>
        <p class="en" style="margin-top:32px">${p.year}</p>
        <p class="idx" style="margin-top:12px">${DATA.kinds[p.kind]}</p>
        ${p.tool?`<h2 style="margin-top:32px">${p.tool}</h2>`:""}
      </div>
      <div class="sec-b">
        <h2>${p.titleZh}</h2>
        <p class="muted" style="margin-top:16px">${p.title}</p>
        <p class="mono" style="margin-top:24px;color:var(--ink)">${p.short} · ${p.journal}</p>
        <p style="margin-top:24px;max-width:42rem;line-height:1.65">${p.oneLiner}</p>
        <p style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap">
          <a class="btn solid" href="https://doi.org/${p.doi}" target="_blank" rel="noreferrer">DOI ${p.doi}</a>
          ${p.github?`<a class="btn" href="${p.github}" target="_blank" rel="noreferrer">Code</a>`:""}
        </p>
      </div>
    </div></section>
    <section><div class="wrap grid12"><div class="sec-k"><div class="idx">Numbers</div></div>
    <div class="sec-b" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));padding:0">
      ${p.numbers.map(n=>`<div class="cell"><b style="font-family:Inter Tight,sans-serif;font-size:1.5rem">${n.value}</b><div class="mono" style="margin-top:8px;color:var(--muted)">${n.label}</div></div>`).join("")}
    </div></div></section>
    ${block("Structure","这篇文章怎么组织", `<div class="box">${p.structure.map(s=>`<div class="row"><div class="num">${s.n}</div><div class="body"><h3>${s.title}</h3><p class="muted" style="margin:8px 0 0">${s.note}</p></div></div>`).join("")}</div>`)}
    ${block("Comparison","如何与其他方法比较", `<p style="line-height:1.65">${p.howTheyCompare}</p>
      <div class="cols cols-2" style="margin-top:32px"><div class="cell"><div class="mono">Compared to</div><ul>${p.comparedTo.map(x=>`<li style="margin-top:8px">${x}</li>`).join("")}</ul></div>
      <div class="cell"><div class="mono">Ground truth</div><p class="muted" style="margin-top:12px">${p.groundTruth}</p>
      <div class="mono" style="margin-top:24px">Datasets</div><ul>${p.datasets.map(x=>`<li class="muted" style="margin-top:6px">${x}</li>`).join("")}</ul></div></div>`)}
    ${block("Metrics","比较什么值", `<div class="filters">${p.metricsUsed.map(m=>`<button type="button">${m}</button>`).join("")}</div>`)}
    ${block("Angles","从什么角度切入", `<div class="box">${p.angles.map((a,i)=>`<div class="row"><div class="num">${String(i+1).padStart(2,"0")}</div><div class="body">${a}</div></div>`).join("")}</div>`)}
    ${block("Findings","关键发现", `<div class="box">${p.keyFindings.map((f,i)=>`<div class="row"><div class="num">${String(i+1).padStart(2,"0")}</div><div class="body">${f}</div></div>`).join("")}</div>
      <p style="margin-top:32px;padding-top:24px;border-top:1px solid var(--ink);max-width:42rem;line-height:1.65"><span class="mono">Takeaway </span>${p.takeaway}</p>`)}
  </article>`+footer();
}
function block(k,t,inner){return `<section><div class="wrap grid12"><div class="sec-k"><div class="idx">${k}</div></div><div class="sec-b"><h2>${t}</h2><div style="margin-top:24px">${inner}</div></div></div></section>`;}
function renderList(kind){
  const papers = DATA.papers.filter(p=>kind==="all"||p.kind===kind).sort((a,b)=>a.year-b.year);
  const box=document.getElementById("plist");
  if(!box) return;
  box.innerHTML=papers.map(p=>`<a class="paper" href="#/p/${p.id}">
    <div class="y">${p.year}<em>${DATA.kinds[p.kind]}</em></div>
    <div class="t"><h3>${p.tool?p.tool+"  ·  ":""}${p.titleZh}</h3>
    <p class="muted" style="margin-top:8px;font-size:14px">${p.oneLiner}</p>
    <p class="mono" style="margin-top:12px;color:var(--faint)">${p.short} · ${p.journal}</p></div></a>`).join("");
}
function bindFilters(){
  const kinds=["all","method","benchmark","review","critique","precursor"];
  const host=document.getElementById("filters");
  if(!host) return;
  let cur="all";
  const draw=()=>{
    host.innerHTML=kinds.map(k=>`<button type="button" class="${k===cur?"on":""}" data-k="${k}">${k==="all"?"全部":DATA.kinds[k]}</button>`).join("");
    host.querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=b.dataset.k;draw();renderList(cur);});
    renderList(cur);
  };
  draw();
}
function route(){
  const hash=location.hash.replace(/^#/, "") || "/";
  const app=document.getElementById("app");
  const m=hash.match(/^\/p\/([^/]+)/);
  if(m){
    const p=DATA.papers.find(x=>x.id===m[1]);
    app.innerHTML=p?paperPage(p):header()+"<main style='padding:80px 24px'><h2>文献未找到</h2><a class='btn' href='#/'>返回</a></main>"+footer();
    scrollTo(0,0);
    return;
  }
  app.innerHTML=home();
  bindFilters();
  const id=hash.split("#")[1];
  if(id){const el=document.getElementById(id); if(el) el.scrollIntoView();}
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>

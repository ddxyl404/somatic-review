<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Somatic / Review</title>
<meta name="description" content="scRNA-seq 体细胞突变算法文献调研：文章结构、比较协议、指标与切入角度。"/>
<meta name="theme-color" content="#e30613"/>
<link rel="icon" href="./favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f7f5f0;--paper:#fff;--ink:#111;--muted:#5a5a5a;--faint:#8a8a8a;--accent:#e30613;--wash:#eceae4}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans SC",Helvetica,Arial,sans-serif}
button,a{cursor:pointer}
::selection{background:var(--accent);color:#fff}
.wrap{max-width:1280px;margin:0 auto}
.g{display:grid;grid-template-columns:repeat(12,1fr)}
header{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--ink)}
header .brand{grid-column:span 12;display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:12px 16px;border-bottom:1px solid var(--ink);font-family:"Inter Tight",sans-serif;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
header nav{grid-column:span 12;display:flex;overflow-x:auto}
header nav a{flex:0 0 auto;min-height:48px;display:flex;align-items:center;padding:12px;border-left:1px solid var(--ink);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
header nav a:first-child{border-left:0}
header nav a:hover,header nav a:focus{background:var(--ink);color:var(--bg)}
h1,h2,h3{font-family:"Inter Tight",sans-serif;font-weight:600;letter-spacing:-.02em}
.slash{color:var(--accent)}
.hero-l{grid-column:span 12;padding:40px 16px;border-bottom:1px solid var(--ink)}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
h1{margin:24px 0 0;font-size:clamp(2.4rem,7vw,5.6rem);line-height:.95}
.lede{margin-top:24px;max-width:36rem;font-size:1.125rem;line-height:1.5}
.sub{margin-top:16px;max-width:36rem;font-size:15px;line-height:1.65;color:var(--muted)}
.stats{grid-column:span 12;display:grid;grid-template-columns:1fr 1fr}
.stat{padding:24px 16px;border-bottom:1px solid var(--ink);border-right:1px solid var(--ink)}
.stats .stat:nth-child(2n){border-right:0}
.stat b{display:block;font-family:"Inter Tight",sans-serif;font-size:1.875rem}
.stat span{display:block;margin-top:8px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
section{border-bottom:1px solid var(--ink)}
.sec-k{grid-column:span 12;padding:24px 16px;border-bottom:1px solid var(--ink)}
.sec-b{grid-column:span 12;padding:32px 16px}
.idx{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.en{margin-top:12px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h2{margin:0;font-size:clamp(1.75rem,4vw,3rem);line-height:1.05}
.muted{color:var(--muted);line-height:1.65;font-size:15px;max-width:48rem}
.box{border:1px solid var(--ink);margin-top:32px}
.row{display:grid;grid-template-columns:repeat(12,1fr);border-bottom:1px solid var(--ink)}
.row:last-child{border-bottom:0}
.num{grid-column:span 3;padding:20px 16px;border-right:1px solid var(--ink);font-family:"Inter Tight",sans-serif;font-size:1.75rem;color:var(--accent)}
.body{grid-column:span 9;padding:20px 16px}
.filters{display:flex;flex-wrap:wrap;border:1px solid var(--ink);margin-top:24px}
.filters button{min-height:44px;border:0;border-right:1px solid var(--ink);background:var(--paper);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:12px 16px;color:var(--ink)}
.filters button.on{background:var(--ink);color:var(--bg)}
.paper{display:grid;grid-template-columns:repeat(12,1fr);border:1px solid var(--ink);border-top:0;text-decoration:none;color:inherit}
.paper:hover{background:var(--wash)}
.paper .y{grid-column:span 3;padding:20px 16px;border-right:1px solid var(--ink);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.paper .y em{display:block;margin-top:8px;color:var(--accent);font-style:normal}
.paper .t{grid-column:span 9;padding:20px 16px}
.paper h3{margin:0;font-size:1.15rem}
.cols{display:grid;grid-template-columns:1fr;border:1px solid var(--ink);margin-top:32px}
.cell{padding:20px 16px;border-bottom:1px solid var(--ink)}
.cell:last-child{border-bottom:0}
.mono{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.small{font-size:13px;line-height:1.65;color:var(--muted);max-width:48rem}
.h3{font-family:"Inter Tight",sans-serif;font-size:1.5rem;margin:48px 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:32px;border:1px solid var(--ink)}
th{background:var(--ink);color:var(--bg);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:12px;text-align:left;border-right:1px solid rgba(255,255,255,.2)}
td{padding:12px;border-top:1px solid var(--ink);border-right:1px solid var(--ink);vertical-align:top}
.bars{margin-top:32px;border:1px solid var(--ink);padding:16px;background:var(--paper)}
.bar-row{display:grid;grid-template-columns:88px 1fr 40px;gap:8px;align-items:center;margin:8px 0;font-family:"IBM Plex Mono",monospace;font-size:11px}
.bar{height:10px;background:#111;position:relative}
.bar i{display:block;height:100%;background:var(--accent)}
footer{background:var(--ink);color:var(--bg)}
footer .a{grid-column:span 12;padding:40px 16px;border-bottom:1px solid rgba(255,255,255,.2)}
footer .b{grid-column:span 12;padding:40px 16px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid var(--ink);text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin-right:8px;margin-top:8px}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{background:var(--accent)}
.chip{display:inline-block;border:1px solid var(--ink);padding:10px 14px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:0 -1px -1px 0}
.faint{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
@media(min-width:768px){
header .brand{grid-column:span 4;border-bottom:0;border-right:1px solid var(--ink);padding:12px 24px}
header nav{grid-column:span 8}
.hero-l{grid-column:span 8;border-bottom:0;border-right:1px solid var(--ink);padding:80px 24px}
.stats{grid-column:span 4;grid-template-columns:1fr}
.stat{border-right:0;padding:24px 32px}
.sec-k{grid-column:span 3;border-bottom:0;border-right:1px solid var(--ink);padding:64px 24px}
.sec-b{grid-column:span 9;padding:64px 40px}
.num{grid-column:span 2;padding:20px 24px}
.body{grid-column:span 10;padding:20px 32px}
.paper .y{grid-column:span 2;padding:20px 24px}
.paper .t{grid-column:span 10;padding:20px 32px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-2 .cell{border-right:1px solid var(--ink)}
.cols-2 .cell:nth-child(2n){border-right:0}
.cols-3{grid-template-columns:1fr 1fr 1fr}
.cols-3 .cell{border-right:1px solid var(--ink)}
.cols-3 .cell:nth-child(3n){border-right:0}
.cols-4{grid-template-columns:1fr 1fr 1fr 1fr}
.cols-4 .cell{border-right:1px solid var(--ink)}
.cols-4 .cell:nth-child(4n){border-right:0}
footer .a{grid-column:span 6;border-bottom:0;border-right:1px solid rgba(255,255,255,.2);padding:40px 24px}
footer .b{grid-column:span 6;padding:40px 40px}
}
</style>
</head>

<div id="app"></div>
<script>
const DATA = {"papers":[{"id":"liu2019","year":2019,"authors":"Liu, Zhang, Zhang, Li, Fang, Gao, Zhang","short":"Liu et al.","title":"Systematic comparative analysis of single-nucleotide variant detection methods from single-cell RNA sequencing data","titleZh":"scRNA-seq 单核苷酸变异检测方法的系统比较","journal":"Genome Biology","doi":"10.1186/s13059-019-1863-4","pmid":"31744515","kind":"benchmark","oneLiner":"领域第一篇系统基准：把七个 bulk/RNA 变异检测器直接打在 scRNA-seq 上，量化 reads、VAF、基因组区域对性能的影响。","structure":[{"n":"00","title":"Background","note":"提出用 scRNA-seq 检测表达变异的动机：细胞异质性、谱系、基因型–表型连结；指出尚无专为 scRNA-seq 设计的 caller，且现有工具未被评估。"},{"n":"01","title":"Results · Simulation","note":"先用模拟数据控制变量：supporting reads、VAF、区域类型。报告 TPR 与 FDR，而不是只给一个总分。"},{"n":"02","title":"Results · Real data","note":"再用真实 scRNA-seq 复现：把仿真结论外推到真实覆盖与表达偏差。"},{"n":"03","title":"Results · Parameter sweep","note":"对关键超参做扫描（如 MuTect2 的 LOD），证明排名会随阈值移动。"},{"n":"04","title":"Discussion / Recommendation","note":"不宣布单一赢家，而是按使用条件给出工具菜单：低覆盖用 SAMtools，读数充足用 Strelka2，高 VAF 用 FreeBayes。"}],"comparedTo":["SAMtools","GATK Best Practices","CTAT","FreeBayes","MuTect2","Strelka2","VarScan2"],"metricsUsed":["TPR / Sensitivity","FDR","Precision","Supporting reads","VAF"],"angles":["工具迁移：bulk RNA/DNA caller 能否直接用于 scRNA-seq","覆盖深度与 supporting reads 作为性能的主轴","变异等位基因频率（VAF）分层","基因组语境：外显子 vs 内含子 vs 高同一性区域"],"datasets":["模拟 scRNA-seq","真实 scRNA-seq（多数据集）"],"groundTruth":"模拟植入的已知 SNV；真实数据以期望位点与深度分层评估。","howTheyCompare":"统一输入 BAM，默认参数为主实验，再对关键参数做敏感性分析。金标准在模拟中完全已知。按 supporting reads（>2、≥10）与 VAF（25/50/75%）切片报告 TPR 与 FDR，避免单一平均掩盖条件依赖性。","numbers":[{"label":"工具数","value":"7"},{"label":"≥10 reads 中位敏感度","value":">99%"},{"label":"中位 FDR","value":"≤0.2%"},{"label":"MuTect2 最大 FDR","value":"2.4%"},{"label":"SAMtools TPR @VAF25","value":"76.6%"}],"keyFindings":["SAMtools 在低 supporting reads 下敏感度最高，但内含子/高同一性区域特异性较差。","Strelka2 在读数充足时表现稳定。","FreeBayes 在高 VAF 时表现好，低 VAF 时 TPR 急剧下降。","VarScan2 需要更多 reads 才能给出可靠结果。","结论是条件化推荐，而不是总冠军。"],"takeaway":"比较文章的原型结构：模拟控变量 → 真实数据验证 → 参数扫描 → 按场景推荐。后续方法论文几乎都引用这篇作为「bulk caller 直接套用不够」的起点。"},{"id":"vu2019","year":2019,"authors":"Vu, Bansal, Chen, et al.","short":"Vu et al.","title":"Cell-level somatic mutation detection from single-cell RNA sequencing","titleZh":"从 scRNA-seq 做细胞水平的体细胞突变检测（SCmut）","journal":"Bioinformatics","doi":"10.1093/bioinformatics/btz288","kind":"method","tool":"SCmut","oneLiner":"不追求 de novo 发现，而是把 bulk DNA 已确认的突变基因型化到每一个细胞，用二维局部 FDR 压假阳性。","structure":[{"n":"00","title":"Motivation","note":"先用实验证明：为 bulk 或 scDNA 设计的 caller 直接跑 scRNA-seq 会产生大量假阳性。"},{"n":"01","title":"Method","note":"两步：bulk 肿瘤/正常 DNA 收集体细胞突变；再与单细胞 RNA SNV 联合，用 2D local FDR 判定哪些细胞携带该突变。"},{"n":"02","title":"Benchmark","note":"在乳腺癌等 scRNA-seq 上与 Mutect、VarScan2、Monovar 比 FPR。"},{"n":"03","title":"Application","note":"把突变映射回细胞，连接克隆与表达表型。"}],"comparedTo":["Mutect","VarScan2","Monovar"],"metricsUsed":["FPR","2D local FDR"],"angles":["任务重定义：cell genotyping vs de novo calling","假阳性控制作为方法核心，而非发现力","必须有配对 bulk DNA 作为先验"],"datasets":["乳腺癌 scRNA-seq（含 BC03）","配对 bulk DNA"],"groundTruth":"bulk 肿瘤–正常 DNA 的体细胞突变集合。","howTheyCompare":"把 Mutect / VarScan2 / Monovar 当作「直接在 scRNA 上 calling」的基线，证明 FPR 不可接受，从而正当化「先 bulk 发现、再细胞分型」的两阶段设计。比较的主指标是假阳性率，而不是敏感度。","numbers":[{"label":"统计框架","value":"2D local FDR"},{"label":"输入依赖","value":"配对 bulk DNA"},{"label":"任务","value":"细胞分型"}],"keyFindings":["bulk 与 scDNA caller 在 scRNA-seq 上假阳性过高，不能直接用。","有配对 DNA 时，细胞水平检出是统计问题（FDR），不是单纯 pileup 阈值问题。"],"takeaway":"方法论文的另一种切入：先证伪现有工具，再缩小问题定义（已知突变的细胞归属），用更严的错误控制换取可信的单细胞基因型。"},{"id":"yizhak2019","year":2019,"authors":"Yizhak, Aguet, Kim, et al.","short":"Yizhak et al.","title":"RNA sequence analysis reveals macroscopic somatic clonal expansion across normal tissues","titleZh":"RNA-MuTect：从 bulk RNA-seq 识别体细胞突变（方法前体）","journal":"Science","doi":"10.1126/science.aaw0726","pmid":"31171664","kind":"precursor","tool":"RNA-MuTect","oneLiner":"不是单细胞论文，但是 scRNA 体细胞检测的直接前体：必须把 RNA editing、胚系位点、等位基因表达偏倚与体细胞突变切开。","structure":[{"n":"00","title":"Biological claim","note":"正常组织存在宏观克隆扩增；RNA-seq 可以在 GTEx 规模上观察。"},{"n":"01","title":"Method","note":"RNA-MuTect：RNA 候选位点对照配对 DNA，过滤 editing 与 germline。"},{"n":"02","title":"Validation","note":"与 DNA 测序交叉验证，讨论组织与年龄相关的突变负荷。"}],"comparedTo":["DNA 配对对照","RNA editing 数据库"],"metricsUsed":["与 DNA 的一致性","突变负荷","克隆扩增"],"angles":["RNA 特有噪声源的分类（editing / germline / ASE）","配对 DNA 作为金标准","生物学终点是克隆扩增而非 caller 排名"],"datasets":["GTEx bulk RNA-seq","配对 DNA"],"groundTruth":"配对 DNA 测序。","howTheyCompare":"不以工具竞赛为主，而以「RNA 候选 vs DNA 证实」定义真阳性。后续 SComatic / RESA 的过滤清单（editing、多态、panel of normals）几乎都从这条思路继承。","numbers":[{"label":"数据类型","value":"bulk RNA"},{"label":"对照","value":"配对 DNA"}],"keyFindings":["RNA-seq 可以回收外显子体细胞突变，但必须显式处理 RNA editing 与等位基因偏倚。","为单细胞方法提供了噪声本体：假阳性主要不是「没对齐」，而是生物学/分子噪声类别。"],"takeaway":"写 scRNA 突变论文时，引言几乎都会经过 RNA-MuTect：先承认 RNA 能看到突变，再指出单细胞使问题难一个数量级。"},{"id":"zhou2020","year":2020,"authors":"Zhou, Xu, Minn, Zhang","short":"Zhou et al.","title":"DENDRO: genetic heterogeneity profiling and subclone detection by single-cell RNA sequencing","titleZh":"DENDRO：用 scRNA-seq 做遗传异质性分析与亚克隆检测","journal":"Genome Biology","doi":"10.1186/s13059-019-1922-x","pmid":"31937348","kind":"method","tool":"DENDRO","github":"https://github.com/zhouzilu/DENDRO","oneLiner":"把「检出突变」改写成「用转录的点突变重建系统发育树」，评价指标从 F1 换成 ARI / capture / purity。","structure":[{"n":"00","title":"Problem shift","note":"承认 scRNA-seq 点突变检出不可靠，但亚克隆归属仍可能稳健——把任务从 variant calling 转到 phylogeny。"},{"n":"01","title":"Model","note":"Beta-Binomial 处理爆发式表达、技术 dropout 与测序错误，计算细胞间遗传距离。"},{"n":"02","title":"Benchmark","note":"模拟数据 + 有已知亚群标签的转移性肾细胞癌。报告聚类准确率，对比既有方法。"},{"n":"03","title":"Application","note":"小鼠黑色素瘤免疫治疗：用亚克隆解释新抗原与治疗反应。"},{"n":"04","title":"DENDROplan","note":"实验设计工具：给定树结构、细胞数、深度，预测 ARI。"}],"comparedTo":["基于表达的聚类","既有遗传距离方法"],"metricsUsed":["ARI","Capture rate","Purity","Clustering accuracy"],"angles":["下游任务替代上游检出：克隆树比单个 SNV 更可评估","统计噪声模型（Beta-Binomial）作为方法卖点","基因型与转录组在同一批细胞上联合解读"],"datasets":["模拟 scRNA-seq","转移性肾细胞癌（已知亚群）","小鼠黑色素瘤免疫治疗"],"groundTruth":"模拟的真实树；真实数据中的已知亚群标签。","howTheyCompare":"比较对象不是 GATK 一类 caller，而是亚克隆检测/聚类方法。用调整兰德指数衡量全局正确性，用 capture 与 purity 衡量每个亚克隆。DENDROplan 进一步把比较推到实验设计层（细胞数 × 深度）。","numbers":[{"label":"癌症类型","value":"3"},{"label":"核心模型","value":"Beta-Binomial"},{"label":"主指标","value":"ARI"}],"keyFindings":["在已知亚群的肾癌数据上，遗传距离聚类优于纯表达聚类。","同一细胞同时有突变谱与表达谱，才能把新抗原与治疗反应连起来。"],"takeaway":"如果你的方法终点是生物学（克隆、治疗），论文结构会把 benchmark 放在「任务指标」上，变异检出只是中间产物。"},{"id":"prashant2021","year":2021,"authors":"Prashant, Liu, Zhang, et al.","short":"Prashant et al.","title":"SCReadCounts: estimation of cell-level SNVs from scRNA-seq data","titleZh":"SCReadCounts：从 scRNA-seq 估计细胞水平 SNV 读数","journal":"BMC Genomics","doi":"10.1186/s12864-021-07974-8","kind":"method","tool":"SCReadCounts","oneLiner":"不宣称自己是 somatic caller，而是提供细胞×位点的 ref/alt 计数与 VAFRNA 矩阵，供已知突变或发现模式使用。","structure":[{"n":"00","title":"Tool paper 结构","note":"输入（barcode BAM + 位点列表）→ 输出矩阵 → 三个应用案例。这是典型的 software/resource 文章骨架。"},{"n":"01","title":"Applications","note":"（1）已知体细胞突变与 RNA editing 的细胞表达；（2）双等位基因位点的等位表达；（3）无先验的 discovery 模式。"},{"n":"02","title":"Case study","note":"7 个神经母细胞瘤、59,884 个细胞，COSMIC 位点回收。"}],"comparedTo":["对合并 BAM 做 variant calling（概念对比）"],"metricsUsed":["检出突变数","细胞覆盖","VAFRNA","minR"],"angles":["量化工具 vs 判定工具","低比例细胞中的体细胞/嵌合 SNV 会被合并 calling 漏掉","把「无表达」与「纯参考等位基因」区分开"],"datasets":["神经母细胞瘤 7 样本 / 59,884 细胞"],"groundTruth":"COSMIC 注释的已知体细胞突变。","howTheyCompare":"几乎不做 F1 竞赛。论证方式是：合并比对的 variant calling 会漏掉只在少数细胞出现的位点；细胞水平计数能找回。SComatic 后来把它当作「单细胞特异方法」基线之一。","numbers":[{"label":"细胞数","value":"59,884"},{"label":"COSMIC 回收","value":"450"},{"label":"默认 minR","value":"3"}],"keyFindings":["在至少 4 个细胞中检出 450 个不同的 COSMIC 突变。","发现模式不需要先验 VCF，但对假阳性没有 SComatic/RESA 那样的统计闸门。"],"takeaway":"工具论文可以靠「矩阵作为中间件」成立；后续方法论文会把它重新放进 caller 排行榜，此时它往往敏感度高、精度低。"},{"id":"huang2021","year":2021,"authors":"Huang, Huang","short":"Huang & Huang","title":"Cellsnp-lite: an efficient tool for genotyping single cells","titleZh":"cellsnp-lite：高效的单细胞双等位基因分型","journal":"Bioinformatics","doi":"10.1093/bioinformatics/btab358","kind":"method","tool":"cellsnp-lite","github":"https://github.com/single-cell-genetics/cellsnp-lite","oneLiner":"不算 somatic caller，却是半个领域的基础设施：输出细胞×位点的等位基因计数，供 demux、Numbat、克隆 mtDNA 使用。","structure":[{"n":"00","title":"Software note","note":"短文结构：动机（速度/内存）→ 四种 mode（给定 SNP vs 发现；10x vs SMART-seq）→ 与 cellSNP 一致性。"},{"n":"01","title":"Contract","note":"明确警告 mode 2 会输出体细胞或 RNA editing 假阳性，不适合直接当 somatic 结果。"}],"comparedTo":["cellSNP","pysam pileup"],"metricsUsed":["速度","内存","与 cellSNP 一致性"],"angles":["中间件论文：比较的是工程指标，不是 F1","把「分型」从「判定体细胞」里拆出去"],"datasets":["10x / SMART-seq 示例"],"groundTruth":"与 cellSNP 的一致性，而非体细胞金标准。","howTheyCompare":"几乎不做 somatic 精度评估。后续 Numbat、SComatic 流水线把它当 pileup 前端。","numbers":[{"label":"体裁","value":"Application Note"},{"label":"模式","value":"4"}],"keyFindings":["给定 SNP 列表时高效稳健；全基因组发现模式会混入体细胞与 editing。","输出矩阵直接对接 vireo / Numbat / MQuad。"],"takeaway":"写方法论文时要把「pileup 工具」和「somatic caller」分开比较，否则你会把 cellsnp-lite 错放进 F1 表。"},{"id":"qin2022","year":2022,"authors":"Qin, Van Nostrand, Zhou, Yeo","short":"Qin et al.","title":"scAllele: A versatile tool for the detection and analysis of variants in scRNA-seq","titleZh":"scAllele：scRNA-seq 变异与等位基因特异性剪接","journal":"Science Advances","doi":"10.1126/sciadv.abn6398","kind":"method","tool":"scAllele","oneLiner":"读段级检出 SNV 与微 indel，并把它连到等位基因特异性剪接。比较的是变异检出 + 剪接连锁，不只是体细胞 F1。","structure":[{"n":"00","title":"Caller + phenotype","note":"先证明低覆盖下 SNV/indel 优于常用工具，再展示独特能力：变异等位基因与剪接异构体的连锁。"},{"n":"01","title":"Cancer application","note":"肺癌 Smart-seq2：部分连锁事件在癌细胞特异、富集癌症通路。"}],"comparedTo":["常用 SNV caller（文中 head-to-head）"],"metricsUsed":["SNV/indel 检出性能","等位基因–剪接关联"],"angles":["把变异从基因型延伸到 RNA 表型","读段级 haplotype 过滤（含 editing）"],"datasets":["肺癌 Smart-seq2（TH179 / TH238，574 细胞）"],"groundTruth":"模拟与常用工具对照；生物学以剪接连锁为准。","howTheyCompare":"强调低覆盖与微 indel，以及别人做不到的等位基因特异性剪接，而不是与 SComatic 同期 F1。","numbers":[{"label":"细胞","value":"574"},{"label":"患者","value":"2"}],"keyFindings":["读段级 calling 有利于稀有/体细胞位点。","部分变异–剪接连锁为癌细胞特异。"],"takeaway":"切入可以是「同一变异的功能读出」，不一定是更高的 somatic F1。"},{"id":"gao2022","year":2022,"authors":"Gao, Bi, Li, et al.","short":"Gao et al.","title":"Haplotype-aware analysis of somatic copy number variations from single-cell transcriptomes","titleZh":"Numbat：单倍型感知的 scRNA-seq 体细胞拷贝数分析","journal":"Nature Biotechnology","doi":"10.1038/s41587-022-01468-y","kind":"method","tool":"Numbat","github":"https://github.com/kharchenkolab/numbat","oneLiner":"SNV caller 的平行世界：用群体相位 + 表达 + 等位基因重建体细胞 CNA 与肿瘤克隆树。SComatic 自己也用它做克隆对照。","structure":[{"n":"00","title":"Joint model","note":"表达倍数、BAF、群体单倍型、亚克隆进化迭代推断。"},{"n":"01","title":"Benchmark","note":"22 个肿瘤样本；与 WGS 拷贝数剖面并置；恶性/正常分类 vs CopyKAT。"}],"comparedTo":["CopyKAT","表达-only 模型","配对 WGS"],"metricsUsed":["恶性/正常分类准确率","与 WGS 剖面一致性","亚克隆恢复"],"angles":["CNA 是另一类「从 scRNA 读体细胞突变」","单倍型把等位基因不平衡变成可计算信号"],"datasets":["骨髓瘤、胃、乳腺、甲状腺等 22 样本"],"groundTruth":"配对 WGS 拷贝数；已知正常细胞。","howTheyCompare":"与 CopyKAT 等比恶性细胞分类和 CNA 剖面，而不是 SNV F1。后续独立基准（2025）仍把 Numbat 列为多数任务第一。","numbers":[{"label":"肿瘤样本","value":"22"},{"label":"对照","value":"WGS"}],"keyFindings":["联合模型优于纯表达。","可在微环境中精确识别恶性细胞并重建克隆。"],"takeaway":"完整调研必须把 CNA 家族写进去：许多「scRNA 体细胞」论文实际比较的是 Numbat，不是 GATK。"},{"id":"xu2022","year":2022,"authors":"Xu, Zhou, Wang, et al.","short":"Xu et al.","title":"Identification of Somatic Mutations From Bulk and Single-Cell Sequencing Data","titleZh":"从 bulk 与单细胞测序数据鉴定体细胞突变（综述）","journal":"Frontiers in Genetics","doi":"10.3389/fgene.2022.802802","kind":"review","oneLiner":"把 DNA / RNA、bulk / 单细胞 caller 放进一张特征表：测序类型、突变类型、是否需要配对对照、是否对非癌优化。","structure":[{"n":"00","title":"Taxonomy","note":"按数据模态切：bulk DNA、scDNA、bulk RNA、scRNA。这是综述最有用的结构决策。"},{"n":"01","title":"Tool table","note":"每个工具一行：可检测突变、是否需要 matched control、是否 joint calling、是否 base-quality aware。"},{"n":"02","title":"scRNA 专节","note":"明确写出当时的限制：多数 scRNA 分析只能「回捕」DNA 已发现的突变（如 SCmut），de novo 仍稀缺。"}],"comparedTo":["Strelka","VarScan2","Monovar","SCAN-SNV","RNA-MuTect","SCmut"],"metricsUsed":["定性能力表（非数值 F1）"],"angles":["能力矩阵比排行榜更适合综述","「是否需要配对对照」是第一分类轴","mtDNA 作为谱系标记的旁路"],"datasets":["文献汇编"],"groundTruth":"不适用；综述不产生新金标准。","howTheyCompare":"比较的是工具契约（输入、输出、假设），不是在同一数据集上的分数。这种「特征表」后来被方法论文的 Table 1 反复模仿。","numbers":[{"label":"比较方式","value":"能力表"},{"label":"主分类轴","value":"模态 × 对照"}],"keyFindings":["scRNA 体细胞检测在 2022 年仍主要是 DNA 突变的再捕获。","线粒体突变是当时少数能在 scRNA/scATAC 上稳健用作谱系标记的信号。"],"takeaway":"综述文章用分类学而非 F1 来比较；你若写 review，一张「输入假设表」比十张柱状图更清楚。"},{"id":"zhang2023","year":2023,"authors":"Zhang, Jia, Song, et al. (Shen lab)","short":"Zhang et al.","title":"De novo identification of expressed cancer somatic mutations from single-cell RNA sequencing data","titleZh":"RESA：从 scRNA-seq de novo 鉴定表达的癌症体细胞突变","journal":"Genome Medicine","doi":"10.1186/s13073-023-01269-1","pmid":"38111063","kind":"method","tool":"RESA","github":"https://github.com/ShenLab-Genomics/RESA","oneLiner":"精度优先的 de novo 框架：双 pipeline 共识 + 跨细胞复发 + 联合逻辑回归。F0.5 作为主指标，公开承认敏感度是次要的。","structure":[{"n":"00","title":"Abstract 公式","note":"问题（de novo 难）→ 方法名 → 关键数字（precision 0.77 / 19 数据集）→ 一个生物学应用（黑色素瘤耐药）。"},{"n":"01","title":"Algorithm (3 stages)","note":"① 两组独立 mapping + calling 降 pipeline bias；② 按跨细胞复发分成高可信突变 / 噪声 / 待判；③ 联合逻辑回归扩大敏感度。"},{"n":"02","title":"Spike-in","note":"人胰腺 >800 细胞的 in silico spike-in，先在可控假阳性下报 precision。"},{"n":"03","title":"Cell line + PDX vs WES","note":"15 细胞系 + 4 PDX，WES 作金标准。与五种已发表流程比 precision / sensitivity / F0.5。"},{"n":"04","title":"Application","note":"黑色素瘤耐药时间序列，回收 BRAF V600E，做瘤内异质性。"}],"comparedTo":["Enge 2017","Maynard 2020","Hovestadt 2019","BCFtools","VarScan","RESA-jLR（自身消融）"],"metricsUsed":["Precision","Sensitivity","F0.5","AUC","VAF correlation"],"angles":["精度是瓶颈：现有方法不是找不到位点，而是假阳性淹没","F0.5 而不是 F1：显式把权重偏向 precision","双 pipeline 共识对抗比对/caller 偏差","细胞系（高 VAF、克隆）→ PDX → 原发肿瘤，难度递增"],"datasets":["3 个 spike-in 组织","15 癌症细胞系 scRNA-seq + 配对 WES","4 个 PDX","黑色素瘤耐药 scRNA-seq"],"groundTruth":"配对 WES；spike-in 植入位点；部分与 bulk RNA-seq 的 VAF 相关。","howTheyCompare":"对所有方法施加相似的过滤参数。金标准是 WES 体细胞 SNV，但只在 scRNA 可覆盖位点上计分。主图是 15 数据集的 precision/sensitivity 箱线，以及 F0.5 散点。自身消融 RESA vs RESA-jLR：回归器提高敏感度、略降精度。","numbers":[{"label":"Spike-in 均精度","value":"0.77"},{"label":"三基线精度","value":"0.84 / 0.87 / 0.87"},{"label":"15 数据集均精度","value":"0.75"},{"label":"jLR 均 AUC","value":"0.90"},{"label":"黑色素瘤突变","value":"575"}],"keyFindings":["在 15 个细胞系上精度显著高于五种基线方法。","jLR 用高可信突变作正例、高可信噪声作负例，AUC 0.79–0.98。","应用中找回 BRAF V600E，并追踪治疗时间点的突变–表达关系。"],"takeaway":"标准「新方法」论文模板：示意图 → 模拟/spike-in → 配对 DNA 金标准大表 → 自身消融 → 一个能讲故事的肿瘤应用。指标选择（F0.5）本身就是论点。"},{"id":"muyas2024","year":2024,"authors":"Muyas, Sauer, Valle-Inclán, Li, Rahbari, Mitchell, Hormoz, Cortes-Ciriano","short":"Muyas et al.","title":"De novo detection of somatic mutations in high-throughput single-cell profiling data sets","titleZh":"SComatic：无需配对 DNA，从 scRNA-seq / scATAC-seq de novo 检测体细胞突变","journal":"Nature Biotechnology","doi":"10.1038/s41587-023-01863-z","pmid":"37414936","kind":"method","tool":"SComatic","github":"https://github.com/cortes-ciriano-lab/SComatic","oneLiner":"当前引用锚点。细胞类型聚合 + Beta-Binomial + 正常 panel + RNA editing 过滤。F1 0.6–0.7，第二名 0.2–0.4。","structure":[{"n":"00","title":"Introduction","note":"单细胞分辨率的体细胞突变对癌症进化、克隆镶嵌、细胞可塑性是必要的；现有方法在分化细胞与多克隆组织上失败。"},{"n":"01","title":"Algorithm overview (Fig. 1)","note":"按细胞类型堆 reads → 记录 alt 在细胞类型间的出现 → Beta-Binomial 相对背景噪声 → 去多态、去 editing、PoN、深度过滤。"},{"n":"02","title":"Accuracy vs matched WGS/WES","note":"cSCC、卵巢癌、肾癌。只在 RNA 可调用位点上计算 sensitivity / precision / F1。"},{"n":"03","title":"Head-to-head (Fig. 3)","note":"Strelka2、SAMtools、VarScan2、Monovar、SCReadCounts。50 次 bootstrap + t 检验。"},{"n":"04","title":"Biological concordance","note":"突变谱与 WES 的 cosine；COSMIC 签名（SBS7 UV、MMRd）；突变负荷 vs TCGA。"},{"n":"05","title":"Applications","note":"克隆异质性热图、单细胞突变负荷、非肿瘤细胞的突变过程。"},{"n":"06","title":"Discussion","note":"承认稀疏与深度限制；强调无需配对样本这一点打开了分化细胞与多克隆组织。"}],"comparedTo":["Strelka2","SAMtools","VarScan2","Monovar","SCReadCounts"],"metricsUsed":["Sensitivity","Precision","F1","Cosine similarity","Mutational signatures","Mutation burden"],"angles":["无需配对 DNA / 正常样本","细胞类型是突变的自然聚合单位（同一分化轨迹）","精度碾压式领先，敏感度并不总是最高——用 F1 做权衡","生物学一致性作为第二裁判：签名与负荷必须像 DNA","把方法推广到 scATAC，证明不是 RNA 特化 hack"],"datasets":["cSCC scRNA-seq + 配对 WES","卵巢癌、肾癌","结直肠 MSI/MSS/POLE","Heart Cell Atlas、GTEx","688 个 scRNA/scATAC 数据集，>260 万细胞"],"groundTruth":"配对基因组测序的体细胞突变；评估限制在 scRNA 有覆盖（至少 1 read）的位点。50× bootstrap 得置信区间。","howTheyCompare":"基线按 Liu 2019 的「scRNA 上表现最好的 bulk pipeline」来选，再加上两个单细胞工具。所有 caller 在可比的最小 alt 支持（3 reads）下运行。主图并排敏感度/精度/F1。次图用突变谱 cosine 与签名分解，防止「高 F1 但生物学荒谬」。统计：双侧 t 检验，FDR 校正。","numbers":[{"label":"F1","value":"0.6–0.7"},{"label":"第二名 F1","value":"0.2–0.4"},{"label":"Precision","value":"0.67–0.87"},{"label":"Strelka2 precision","value":"0.06–0.24"},{"label":"Sensitivity","value":"0.33–0.56"},{"label":"SBS7 cosine","value":"0.98"}],"keyFindings":["Strelka2 / VarScan2 / SCReadCounts 敏感度可以更高，但精度崩溃，F1 被 SComatic 大幅超过。","cSCC 中 77% 突变归到 SBS7a–d，与 WES 谱 cosine 0.98。","可以在没有配对 DNA 的分化细胞、多克隆组织中估计突变负荷与签名。"],"takeaway":"目前的方法论文黄金模板：大队列规模数字 + 三数据集 F1 柱状图 + 签名 cosine 作为生物学质控 + 一个「以前做不到」的组织类型。后续 LongSom 与批判预印本都以它为对照。"},{"id":"dou2024","year":2024,"authors":"Dou, Tan, Sun, et al.","short":"Dou et al.","title":"Single-nucleotide variant calling in single-cell sequencing data with Monopogen","titleZh":"Monopogen：利用连锁不平衡从单细胞数据检出 SNV","journal":"Nature Biotechnology","doi":"10.1038/s41587-023-01873-x","pmid":"37592035","kind":"method","tool":"Monopogen","oneLiner":"把群体遗传学搬进单细胞：用参考面板 LD 救稀疏覆盖下的胚系分型，再用细胞群体共分离找体细胞。","structure":[{"n":"00","title":"Two-module design","note":"模块一：胚系（与 1KG 等面板重叠，LD 精炼，95% 分型准确）。模块二：体细胞（SVM 去低质量 + 细胞群体 LD 精炼）。"},{"n":"01","title":"Germline accuracy","note":"与配对 WGS 比 genotyping accuracy、检出数量（100K–3M）。"},{"n":"02","title":"Somatic module","note":"期望：除亚群中体细胞改变的位点外，等位基因与邻近位点完美 LD。违反者即候选体细胞。"},{"n":"03","title":"Applications","note":"祖先推断、心肌代谢相关变异、图谱规模队列。"}],"comparedTo":["配对 WGS 金标准","Monovar（簇水平新位点）"],"metricsUsed":["Genotyping accuracy","SNV count","Ancestry inference"],"angles":["稀疏短读不是信息不足，而是需要外部 LD","胚系与体细胞必须拆成两个统计问题","平台无关：scRNA / snRNA / scATAC / scDNA","体细胞是「打破 LD 的位点」，不是简单的 alt 计数"],"datasets":["视网膜、正常乳腺、亚洲免疫图谱","配对 WGS 子集"],"groundTruth":"配对全基因组测序的胚系基因型；体细胞为 putative，用共分离与 SVM 约束。","howTheyCompare":"胚系部分有硬金标准（WGS 一致性）。体细胞部分更审慎，报的是数量级（hundreds）与生物学可用性，而不是对 SComatic 的 F1 对打。用 Monovar 做簇水平新 SNV 的后端。","numbers":[{"label":"胚系 SNV","value":"100K–3M"},{"label":"分型准确率","value":"95%"},{"label":"体细胞数量级","value":"数百"}],"keyFindings":["10x scRNA/snRNA 可召回 100K–1M 胚系 SNV，scATAC 1–2.5M，准确率 >0.95。","细胞群体水平的 LD 精炼能把稀疏短读里的体细胞候选从噪声里拉开。"],"takeaway":"同一年 Nat Biotech 的另一条路：不跟 SComatic 抢 F1，而是证明单细胞数据里藏着可用的群体遗传信号。比较角度是「分型准确率 + 规模」，不是 precision-recall。"},{"id":"dondi2025","year":2025,"authors":"Dondi, Borgsmüller, Ferreira, Haas, Jacob, Heinzelmann-Schwarz, Beerenwinkel","short":"Dondi et al.","title":"De novo detection of somatic variants in high-quality long-read single-cell RNA sequencing data","titleZh":"LongSom：高质量长读长 scRNA-seq 的 de novo 体细胞变异检测","journal":"Genome Research","doi":"10.1101/gr.279281.124","pmid":"40107722","kind":"method","tool":"LongSom","github":"https://github.com/cbg-ethz/LongSom","oneLiner":"把 SComatic 思路迁到长读长，并加上细胞类型重注释、融合、CNA、mtSNV，用 scWGS 做金标准直接挑战 SComatic。","structure":[{"n":"00","title":"Overview","note":"输入 BAM + 细胞类型 → 用突变谱重注释细胞类型 → 调 SNV/mtSNV/融合/CNA → BnpC 重建克隆。"},{"n":"01","title":"Why reannotation","note":"错误的细胞类型会让体细胞位点被当成胚系过滤。重注释可提升敏感度至 31%。"},{"n":"02","title":"vs SComatic (Fig. 5)","note":"同一长读长数据上对打：Venn、scWGS 支持、precision / sensitivity / F1。"},{"n":"03","title":"LR vs SR","note":"同一批细胞的短读 vs 长读：短读 SComatic 只得到 114 个位点，约为长读的 1/7.3，交集仅 9。"},{"n":"04","title":"Clinical readout","note":"SNV+融合定义的亚克隆有不同的预测治疗结局。"}],"comparedTo":["SComatic","scWGS","短读 scRNA-seq","inferCNV"],"metricsUsed":["Precision","Sensitivity","F1","Call overlap","scWGS support","Clone recovery"],"angles":["直接挑战领域锚点方法（SComatic）","细胞类型错误是假阴性来源，不是小预处理细节","长读长同时给 SNV、融合、CNA，克隆重建不再只靠点突变","金标准升级为 scWGS，而不只是 bulk WES"],"datasets":["3 例高级别浆液性卵巢癌，同一细胞的 LR + SR scRNA-seq + scWGS"],"groundTruth":"匹配的 scWGS / panel；评估时要求 scRNA 至少 1 read 覆盖。","howTheyCompare":"为公平，把 LongSom 的 10 kb 簇过滤也加到 SComatic 上。报告每患者 Venn（重叠 40–72%）。对 scWGS 支持的位点算 precision 0.44–0.5 vs 0.41–0.46，sensitivity 0.19–0.55 vs 0–0.13。再用短读对照证明模态本身限制检出。","numbers":[{"label":"Precision","value":"0.44–0.50"},{"label":"Sensitivity","value":"0.19–0.55"},{"label":"vs SComatic 敏感度","value":"0–0.13"},{"label":"SR 位点","value":"114（×1/7.3）"},{"label":"重注释增益","value":"+31%"}],"keyFindings":["精度与 SComatic 相近，敏感度显著更高，主因是细胞类型重注释避免把体细胞当胚系丢掉。","长短读交集极小，说明短读 scRNA 的可检测突变集合本身很窄。","SNV+融合足以恢复与 scWGS 一致的亚克隆。"],"takeaway":"2025 年的比较已经从「对 GATK」升级到「对 SComatic」。结构上多了 Venn、模态对比（LR/SR）和克隆一致性，F1 不再是唯一语言。"},{"id":"nrc2025","year":2025,"authors":"Nature Reviews Cancer · Tools of the Trade","short":"Nat Rev Cancer","title":"Detecting somatic mutations in single-cell data with SComatic","titleZh":"用 SComatic 在单细胞数据中检测体细胞突变（工具评介）","journal":"Nature Reviews Cancer","doi":"10.1038/s41568-025-00799-7","kind":"review","tool":"SComatic","oneLiner":"用两栏篇幅把 SComatic 的关键假设写成可证伪清单：同一分化轨迹、细胞类型聚合、PoN、editing。后续批判文章打的就是这些句子。","structure":[{"n":"00","title":"Problem list","note":"稀疏、胚系污染、表达导致的深度不均、RNA editing、伪差。"},{"n":"01","title":"How the algorithm answers each","note":"一对一映射：轨迹假设→按细胞类型堆 reads；假阳性→多态/editing/PoN/深度。"}],"comparedTo":["概念上的既有 SNV caller"],"metricsUsed":["定性"],"angles":["把方法的假设写成可证伪的清单——这正是后续批判文章的切入点"],"datasets":["指向 Muyas 2024"],"groundTruth":"不适用。","howTheyCompare":"不比较分数，比较「挑战–对策」配对。适合作为写 Introduction 的提纲。","numbers":[{"label":"体裁","value":"Tools of the Trade"}],"keyFindings":["核心假设：大多数体细胞突变发生在同一分化轨迹的细胞类型中。","假阳性被拆成几类独立过滤器，而不是一个黑盒分数。"],"takeaway":"短评型文章的价值是把长文的假设提取出来，方便你在自己的论文里引用或反驳。"},{"id":"esophagus2026","year":2026,"authors":"bioRxiv survey in the esophagus","short":"Esophagus survey","title":"Somatic mutation inference from single-cell transcriptomics: A survey in the esophagus","titleZh":"从单细胞转录组推断体细胞突变：食管调查（对 SComatic 的实证压力测试）","journal":"bioRxiv","doi":"10.64898/2026.07.07.737010","kind":"critique","tool":"SComatic","oneLiner":"按官方流程跑 SComatic 后，用同窝小鼠 / 同一供体多活检做对照，发现大部分「可接受」变异其实是未滤净的 SNP 或文库共有伪差。","structure":[{"n":"00","title":"Reproduce then stress-test","note":"先承认 SComatic 是目前最稳健的工具，再设计正交对照检验其假阳性。"},{"n":"01","title":"Orthogonal germline control","note":"小鼠同窝、人类同一供体多活检：跨文库共享的位点更像 SNP/伪差，而不是体细胞。"},{"n":"02","title":"Database intersection","note":"约 30% 与 dbSNP 且在 1KG/gnomAD 有频率的位点重叠。"},{"n":"03","title":"Rescue the rest","note":"额外过滤后约 70% 可视为较可信体细胞；未知位点的克隆大小与基因结构类似已知体细胞。"}],"comparedTo":["SComatic 原论文数字","dbSNP / gnomAD / 1KG"],"metricsUsed":["跨个体共享率","dbSNP 重叠","克隆大小","基因结构注释"],"angles":["原论文 F1 可能高估：金标准与过滤都在同一分子逻辑里","跨样本共享是检测 germline 泄漏的廉价正交轴","内含子/基因间突变比例高不一定是伪差（scATAC 也有）"],"datasets":["小鼠同窝对照","人类供体多活检食管 scRNA-seq"],"groundTruth":"跨个体/跨活检共享；群体数据库。不是第二套 WGS。","howTheyCompare":"不重跑 Liu 的七个 caller，而是对「当前最佳」做外部效度检验。比较的值从 F1 换成共享率与数据库重叠。这是批判/复现文章的典型切入。","numbers":[{"label":"dbSNP 可疑比例","value":"~30%"},{"label":"过滤后可信","value":"~70%"},{"label":"原论文 DNA 回收","value":"40–70%"}],"keyFindings":["按官方教程得到的位点，大部分仍可能是 SNP 或扩增/测序伪差。","即使如此，SComatic 仍被当作目前最可用的起点，只是必须加跨样本对照。"],"takeaway":"领域进入第二阶段：新文章可以不再发明 caller，而是压力测试现有 caller。比较角度从「谁 F1 高」变成「假阳性从哪类生物学对照里漏出来」。"}],"essays":{"liu2019":{"readFor":"比较文章的原型：模拟控变量 → 真实数据 → 参数扫描 → 按场景推荐，而不是宣布总冠军。","essay":"2019 年之前，人们把 bulk DNA / RNA 的 caller 直接接到 scRNA-seq 上，却几乎没有人系统问过：这些工具在单细胞覆盖、表达偏倚和等位基因脱落下还剩多少可信度。Liu 等人做的不是新算法，而是把七个当时常用的检测器（SAMtools、GATK Best Practices、CTAT、FreeBayes、MuTect2、Strelka2、VarScan2）放进同一份 BAM，用模拟数据把 supporting reads 与 VAF 拆开，再用真实 scRNA-seq 复现。它给出的不是排行榜，而是一张条件化菜单：低覆盖用 SAMtools，读数充足用 Strelka2，高 VAF 用 FreeBayes。后续几乎所有方法论文都把这篇当作「bulk caller 直接套用不够」的起点——SComatic 的基线选择、RESA 的精度叙事，都可以从这里读出来。","four":{"structure":"典型基准论文骨架：Background 提出「尚无 scRNA 专用 caller」→ Results 先模拟后真实 → 超参扫描证明排名会动 → Discussion 按使用条件给菜单。没有 Figure 1 算法阶梯，因为作者不是在卖新方法。","compare":"统一输入 BAM、默认参数为主实验，再对 MuTect2 的 LOD 等关键阈值做敏感性分析。比较对象是同代 bulk/RNA caller，不是后来的 SComatic。金标准在模拟中完全已知，真实数据则以期望位点与深度分层。","metrics":"主报 TPR 与 FDR，并按 supporting reads（>2、≥10）和 VAF（25/50/75%）切片。≥10 reads 时中位敏感度可 >99%、中位 FDR ≤0.2%，但 SAMtools 在 VAF 25% 时 TPR 掉到 76.6%。单一平均会把这些条件依赖性抹掉。","angle":"工具迁移：bulk 世界的检测器能否直接用于 scRNA-seq。切入点是覆盖深度、VAF 与基因组区域（外显子 / 内含子 / 高同一性），而不是发明新统计量。"}},"vu2019":{"readFor":"把问题从「发现突变」改写成「已知突变的细胞归属」，用更严的 FDR 换可信的单细胞基因型。","essay":"SCmut 几乎是和 Liu 2019 同时出现的另一条路。Vu 等人先用实验证明：为 bulk 或 scDNA 设计的 Mutect、VarScan2、Monovar 直接跑 scRNA-seq，假阳性高到不可用。他们不试图修好 de novo calling，而是缩小问题：先用配对 bulk 肿瘤/正常 DNA 收集体细胞突变集合，再把每个位点基因型化到每一个细胞，用二维局部 FDR 做判定。比较的主指标因此变成 FPR，而不是敏感度——因为任务已经从「找新位点」变成「把已知位点投到细胞」。这篇把「有没有配对 DNA」写成了输入契约：有配对时，细胞水平检出是统计问题；没有配对时，这条路走不通。2022 年 Xu 综述仍把当时的 scRNA 体细胞分析概括为「DNA 突变的再捕获」，指的就是这一传统。","four":{"structure":"证伪 → 重定义任务 → 统计方法 → 在乳腺癌 scRNA 上比 FPR → 把突变映射回细胞连表达。这是「先证明别人不能用，再证明缩小问题后能用」的方法论文模板。","compare":"把 Mutect / VarScan2 / Monovar 当作「直接在 scRNA 上 calling」的基线，目的是展示 FPR 不可接受，从而正当化两阶段设计。不是在同一 de novo 任务上比 F1。","metrics":"2D local FDR 与 FPR。敏感度受限于 bulk DNA 已经发现的集合，所以作者几乎不把它当主指标。与 bulk VAF 的相关性（原文约 r = 0.89）用来证明细胞水平信号不是随机噪声。","angle":"任务重定义。假阳性控制是方法核心，发现力被主动放弃。必须有配对 bulk DNA 作为先验——这是和 SComatic / RESA 分家的第一刀。"}},"yizhak2019":{"readFor":"不是单细胞论文，却给后来所有 scRNA caller 提供了噪声本体：editing、germline、等位基因表达必须切开。","essay":"RNA-MuTect 做的是 bulk RNA-seq：在 GTEx 规模上证明正常组织存在宏观克隆扩增。对 scRNA 方法学来说，它的贡献不是分数，而是一张噪声分类表。RNA 候选位点必须对照配对 DNA，并显式过滤 RNA editing、胚系多态和等位基因表达偏倚（ASE），剩下的才可能是体细胞突变。SComatic 的 REDIportal / dbSNP / panel of normals，RESA 的双 pipeline 共识，几乎都从这条思路继承。写 scRNA 突变论文的引言，通常会先承认「RNA 能看到突变」（RNA-MuTect），再指出「单细胞使问题难一个数量级」（稀疏、dropout、细胞类型）。生物学终点是克隆扩增与组织/年龄相关的突变负荷，而不是 caller 排名——这一点也预告了后来「生物学第二裁判」的写法。","four":{"structure":"生物学主张（正常组织有宏观克隆）→ 方法（RNA 候选 vs 配对 DNA，去 editing / germline）→ 与 DNA 交叉验证。综述式方法前体，没有工具竞赛节。","compare":"不以工具对打为主，而以「RNA 候选 vs DNA 证实」定义真阳性。比较的是分子证据链，不是 F1 柱状图。","metrics":"与 DNA 的一致性、突变负荷、克隆扩增规模。这些后来分别演变成 SComatic 的 cosine / burden 和第二裁判。","angle":"先给 RNA 特有噪声源分类，再谈检测。配对 DNA 是金标准。终点是生物学（克隆），不是算法排行。"}},"zhou2020":{"readFor":"承认点突变检出不可靠，把任务改成亚克隆树；评价指标从 F1 换成 ARI / capture / purity。","essay":"DENDRO 做了一个很多后继者仍在重复的决定：与其在不可靠的单细胞 SNV 上硬比 F1，不如问「这些噪声位点能不能仍把细胞分成对的亚克隆」。Zhou 等人用 Beta-Binomial 同时处理爆发式表达、技术 dropout 和测序错误，计算细胞间遗传距离，再聚类。比较对象因此不是 GATK，而是基于表达的聚类和既有遗传距离方法。在有已知亚群标签的转移性肾细胞癌上，遗传距离的 ARI 显著高于纯表达聚类（原文约 0.932 vs 0.489）。应用节把同一批细胞的突变谱与表达谱连起来，解释小鼠黑色素瘤免疫治疗中的新抗原与反应。附带的 DENDROplan 还把比较推到实验设计层：给定树结构、细胞数和深度，预测你能得到怎样的 ARI。读这篇是为了记住——任务一变，基线、指标、金标准全部重选。","four":{"structure":"问题改写（检出不可靠但亚克隆可能稳健）→ Beta-Binomial 距离模型 → 模拟 + 已知亚群的真实数据 → 免疫治疗应用 → 实验设计工具 DENDROplan。应用节决定它能发在 Genome Biology 而不是纯软件笔记。","compare":"对的是亚克隆检测 / 聚类方法，不是 variant caller。用 ARI 衡量全局正确性，用 capture 与 purity 衡量每个亚克隆。DENDROplan 把「细胞数 × 深度」也纳入比较。","metrics":"ARI、capture rate、purity、clustering accuracy。位点级 precision 几乎不出场。如果你把 DENDRO 放进 SComatic 的 F1 表，就是在比较两种不同的科学问题。","angle":"下游任务替代上游检出。统计噪声模型（Beta-Binomial）是方法卖点。基因型与转录组必须在同一批细胞上联合解读，才有治疗故事。"}},"prashant2021":{"readFor":"软件/资源论文：输出细胞×位点的计数矩阵，而不是判定「这是不是体细胞」。","essay":"SCReadCounts 不宣称自己是 somatic caller。它吃 barcode BAM 和一份位点列表，吐出细胞×位点的 ref/alt 计数与 VAFRNA 矩阵。三个应用案例撑起文章：已知体细胞/editing 的细胞表达、双等位基因的等位表达、以及无先验的 discovery 模式。在 7 个神经母细胞瘤、59,884 个细胞里，它在至少 4 个细胞中回收了 450 个不同的 COSMIC 突变。论证方式几乎不做 F1 竞赛，而是指出：对合并 BAM 做 variant calling 会漏掉只在少数细胞出现的位点。SComatic 后来把它当作「单细胞特异方法」基线之一——此时它往往敏感度高、精度低，因为发现模式没有 SComatic/RESA 那样的统计闸门。读这篇是为了把「量化工具」和「判定工具」分开：矩阵是中间件，caller 是闸门。","four":{"structure":"典型 software/resource 骨架：输入契约 → 输出矩阵 → 三个应用 → 一个大队列案例。没有配对 DNA 金标准大表，也没有消融。","compare":"概念上对比「合并 BAM 的 variant calling」，证明细胞水平计数能找回低比例细胞中的位点。几乎不报与 GATK 的 F1。","metrics":"检出突变数、细胞覆盖、VAFRNA、minR（默认 3）。这些是资源可用性指标，不是分类性能指标。","angle":"量化 vs 判定。坚持细胞水平计数，把「无表达」与「纯参考等位基因」区分开。低比例嵌合 SNV 是合并 calling 的盲区。"}},"huang2021":{"readFor":"基础设施短文。比较的是速度、内存和与 cellSNP 的一致性；mode 2 不能直接当 somatic 结果。","essay":"cellsnp-lite 不算 somatic caller，却是半个领域的基础设施。它输出细胞×位点的等位基因计数，供 demux（vireo）、CNA（Numbat）、线粒体谱系（MQuad）使用。文章是 Bioinformatics 的 Application Note：动机是速度和内存，四种 mode 覆盖「给定 SNP vs 发现」以及「10x vs SMART-seq」。作者明确警告 mode 2（全基因组发现）会输出体细胞或 RNA editing 假阳性，不适合直接当 somatic 结果。比较对象是 cellSNP 和 pysam pileup，指标是工程量而非 F1。后续 SComatic、Numbat 流水线经常把它当 pileup 前端。写方法论文时如果把它放进 somatic F1 表，就是在把中间件和判定器当成同一类工具。","four":{"structure":"短文：动机（速度/内存）→ 四种 mode 的输入契约 → 与 cellSNP 一致性。合同写在正文里：发现模式会混入体细胞与 editing。","compare":"几乎不做 somatic 精度评估。比的是吞吐、峰值内存、以及与前代 cellSNP 的位点一致性。","metrics":"速度、内存、与 cellSNP 一致性。没有 precision / recall。","angle":"把「分型」从「判定体细胞」里拆出去。中间件论文用工程指标说话，才能避免被后来的 caller 论文误读。"}},"qin2022":{"readFor":"把变异从基因型延伸到 RNA 表型：SNV/微 indel 连到等位基因特异性剪接。","essay":"scAllele 的卖点不是更高的癌症体细胞 F1，而是读段级检出 SNV 与微 indel，并把它连到等位基因特异性剪接。Qin 等人先在低覆盖下与常用 SNV caller 对打，再展示别人做不到的功能读出：变异等位基因与剪接异构体的连锁。肺癌 Smart-seq2（TH179 / TH238，574 细胞）上，部分连锁事件在癌细胞特异、并富集癌症通路。读段级 haplotype 过滤（含 editing）是方法的技术核心。切入可以是「同一变异的功能读出」，不一定是更高的 somatic F1——这为后来想发 Science Advances / 系统生物学向的文章提供了另一条结构：caller 只是前半，表型连锁才是 Results D。","four":{"structure":"Caller + phenotype 两段式：先证明低覆盖下 SNV/indel 优于常用工具，再展示变异–剪接连锁，最后落到肺癌的癌症通路。","compare":"强调低覆盖与微 indel，以及别人做不到的等位基因特异性剪接，而不是与同期 SComatic 比 F1（SComatic 还没出来）。","metrics":"SNV/indel 检出性能，加上等位基因–剪接关联的富集。后一项没有标准 F1，用的是功能一致性。","angle":"基因型到 RNA 表型的延伸。读段级 haplotype 既是过滤也是新信号。功能读出可以替代「再高 0.03 的 F1」。"}},"gao2022":{"readFor":"SNV caller 的平行世界：从表达+等位基因+单倍型读体细胞拷贝数。完整调研必须把 CNA 家族写进去。","essay":"许多「从 scRNA 读体细胞突变」的论文，实际比较的不是 GATK，而是 Numbat。Gao 等人把表达倍数、BAF、群体单倍型与亚克隆进化放进一个迭代模型，在 22 个肿瘤样本上与配对 WGS 拷贝数剖面并置，恶性/正常分类对比 CopyKAT。联合模型优于纯表达；可在微环境中精确识别恶性细胞并重建克隆。SComatic 自己也用 Numbat 做克隆对照。2025 年的独立 CNA 基准仍然把 Numbat 列为多数任务第一，CopyKAT 在只有表达矩阵时更稳，inferCNV 擅长单平台亚克隆。读这篇是为了给调研补上第二张地图：点突变和拷贝数是两条平行的「scRNA 体细胞」线索，混用指标会把综述写乱。","four":{"structure":"联合模型（表达+BAF+单倍型+进化）→ 22 样本对 WGS 的基准 → 恶性/正常分类与亚克隆恢复。这是方法+基准混合结构，金标准是拷贝数剖面而非 SNV VCF。","compare":"与 CopyKAT、表达-only 模型、配对 WGS 比。比的是分类准确率和 CNA 剖面一致性，显式不是 SNV F1。","metrics":"恶性/正常分类准确率、与 WGS 剖面一致性、亚克隆恢复、cnLOH 检出。需要群体相位信息是它的输入契约，也是 CopyKAT 可以在「纯表达」场景赢回去的原因。","angle":"CNA 是另一类「从 scRNA 读体细胞改变」。单倍型把等位基因不平衡变成可计算信号。完整的方法学调研不能只写 SNV。"}},"xu2022":{"readFor":"综述最有用的结构决策：按数据模态切，用能力表而不是 F1 排行榜来比较工具。","essay":"Xu 等人把 DNA / RNA、bulk / 单细胞 caller 放进一张特征表：测序类型、可检测突变、是否需要 matched control、是否 joint calling、是否对非癌优化。这是综述文章最清楚的一刀——比较的是工具契约（输入、输出、假设），不是在同一数据集上的分数。scRNA 专节写明当时的限制：多数分析只能「回捕」DNA 已发现的突变（如 SCmut），de novo 仍稀缺。线粒体突变被单独指出：它是当时少数能在 scRNA/scATAC 上稳健用作谱系标记的信号。方法论文后来的 Table 1，几乎都在模仿这张能力表。若你要写 review，一张「输入假设表」比十张柱状图更清楚；若你要写新方法，先把自己填进这张表的一个空格。","four":{"structure":"分类学：按 bulk DNA / scDNA / bulk RNA / scRNA 切章节 → 每个工具一行的特征表 → scRNA 专节写限制 → mtDNA 旁路。没有新金标准。","compare":"比较工具契约，不是分数。第一分类轴是「是否需要配对对照」。这种特征表后来被方法论文反复模仿。","metrics":"定性能力表，非数值 F1。综述如果硬排 F1，会把不同任务、不同分母的数字放在同一列。","angle":"能力矩阵比排行榜更适合综述。「是否需要配对对照」是第一分类轴；mtDNA 作为谱系标记是旁路切入。"}},"zhang2023":{"readFor":"精度优先的 de novo 模板：双 pipeline 共识 + 跨细胞复发 + 联合逻辑回归；主报 F0.5 本身就是论点。","essay":"RESA 是 2023 年底把「scRNA de novo」写成可重复框架的关键一篇。Zhang 等人的三阶段很清楚：两组独立 mapping + calling 降 pipeline bias；按跨细胞复发分成高可信突变 / 噪声 / 待判；联合逻辑回归（jLR）扩大敏感度。指标选择毫不含糊——F0.5，把权重偏向 precision，等于在论文里声明假阳性比假阴性更不可接受。评估阶梯也是后来的标准动作：人胰腺 spike-in 先在可控假阳性下报精度 0.77；15 个癌症细胞系 + 4 个 PDX 用 WES 作金标准，均精度约 0.75，显著高于五种已发表流程；自身消融 RESA vs RESA-jLR 证明回归器提高敏感度、略降精度（AUC 0.79–0.98）。应用节在黑色素瘤耐药时间序列里回收 BRAF V600E，做瘤内异质性。这就是标准「新方法」论文模板：示意图 → 模拟/spike-in → 配对 DNA 金标准大表 → 自身消融 → 一个能讲故事的肿瘤应用。","four":{"structure":"Abstract 公式（问题 → 方法名 → precision 0.77 / 19 数据集 → 耐药应用）→ 三阶段算法 → spike-in → 细胞系/PDX vs WES → 黑色素瘤。难度递增：细胞系（高 VAF、克隆）→ PDX → 原发。","compare":"对所有方法施加相似过滤参数。金标准是 WES 体细胞 SNV，但只在 scRNA 可覆盖位点上计分。主图是 15 数据集的 precision/sensitivity 箱线与 F0.5 散点。基线是 Enge 2017、Maynard 2020、Hovestadt 2019、BCFtools、VarScan——仍是「前 SComatic」世代。","metrics":"Precision、Sensitivity、F0.5、AUC、与 bulk RNA-seq 的 VAF 相关。F0.5 而不是 F1，是这篇最重要的修辞决定。","angle":"精度是瓶颈：现有方法不是找不到位点，而是假阳性淹没。双 pipeline 对抗比对/caller 偏差；跨细胞复发把「单细胞稀疏」变成「群体证据」。"}},"muyas2024":{"readFor":"当前短读锚点。细胞类型聚合 + Beta-Binomial + PoN + editing；F1 0.6–0.7，第二名 0.2–0.4。","essay":"SComatic 是这条线索里被引用最多的一篇，也是后续 LongSom 与食管批判预印本共同的对照。Muyas 等人的核心假设写得很硬：大多数体细胞突变发生在同一分化轨迹的细胞类型中，因此可以把同一细胞类型的 reads 堆起来，用 Beta-Binomial 相对背景噪声打分，再去多态、去 RNA editing、过 panel of normals 和深度过滤。不需要配对 DNA——这一点打开了分化细胞与多克隆组织。比较协议几乎是教科书：基线按 Liu 2019 里「scRNA 上最好的 bulk pipeline」来选，加上 Monovar 与 SCReadCounts；所有 caller 在可比的最小 alt 支持（3 reads）下运行；只在 RNA 可调用位点上算 sensitivity / precision / F1；50 次 bootstrap + 双侧 t 检验、FDR 校正。数字很刺眼：F1 0.6–0.7 vs 第二名 0.2–0.4，precision 0.67–0.87 vs Strelka2 的 0.06–0.24。但敏感度并不总是最高（0.33–0.56），Strelka2 / VarScan2 / SCReadCounts 可以更灵敏，精度却崩溃。生物学第二裁判同样完整：cSCC 中 77% 突变归到 SBS7a–d，与 WES 谱 cosine 0.98；突变负荷对照 TCGA；方法再推到 scATAC，证明不是 RNA 特化 hack。规模数字（688 个数据集、>260 万细胞）让摘要能写得很满。限制也写在 Discussion：稀疏与深度决定敏感度上限；细胞类型错误会把体细胞当成胚系过滤——这正是 LongSom 和食管调查后来打进去的缝。","four":{"structure":"黄金九格几乎被填满：Introduction 的分化细胞 gap → Fig.1 过滤阶梯 → 配对 WGS/WES 的 F1 → Fig.3 对打 → 签名 cosine 与负荷 → 克隆/非肿瘤细胞应用 → 承认稀疏。这是目前方法论文的默认骨架。","compare":"基线分代清楚（bulk 最优 + 两个单细胞工具）。输入契约对齐（同一最小 alt 支持）。callable 定义为 scRNA 至少 1 read。统计有区间和多重检验。次图用突变谱防止「高 F1 但生物学荒谬」。","metrics":"Sensitivity、Precision、F1 是主表；cosine similarity、mutational signatures、mutation burden 是第二裁判。F1 用来宣布全面领先，但正文承认精度才是拉开差距的轴。","angle":"无需配对 DNA；细胞类型是突变的自然聚合单位；精度碾压式领先、敏感度可让；生物学一致性作质控；推广到 scATAC。五条切入叠在一篇里，所以它成为锚点。"}},"dou2024":{"readFor":"同一年 Nat Biotech 的另一条路：不跟 SComatic 抢 F1，用参考面板 LD 救稀疏覆盖下的胚系分型。","essay":"Monopogen 把群体遗传学搬进单细胞。Dou 等人拆成两个模块：胚系部分与 1KG 等面板重叠，用连锁不平衡精炼，分型准确率约 95%，规模 100K–3M SNV；体细胞部分先用 SVM 去低质量，再看细胞群体共分离——期望除亚群中体细胞改变的位点外，等位基因与邻近位点完美 LD，违反者即候选体细胞。平台声称无关：scRNA / snRNA / scATAC / scDNA 都能跑。比较语言与 SComatic 完全不同：胚系有硬金标准（与配对 WGS 的 genotyping accuracy），体细胞更审慎，报的是数量级（数百）与生物学可用性（祖先推断、心肌代谢相关变异），而不是 precision-recall。用 Monovar 做簇水平新 SNV 的后端。读这篇是为了看见「不抢同一张 F1 表」也可以发在同一本期刊——前提是你把任务、金标准、指标全部换成另一套自洽的语言。","four":{"structure":"两模块设计 → 胚系对 WGS 的准确率与数量 → 体细胞的 LD 违反逻辑 → 图谱规模应用。体细胞没有独立的大 F1 表，这是有意的。","compare":"胚系对配对 WGS；体细胞不与 SComatic 对打。Monovar 只作为簇水平新位点的后端。比较角度是「分型准确率 + 规模」。","metrics":"Genotyping accuracy、SNV count、祖先推断可用性。把这些数字放进 SComatic 的 precision 列，是范畴错误。","angle":"稀疏短读不是信息不足，而是需要外部 LD。胚系与体细胞必须拆成两个统计问题。体细胞被重新定义为「打破 LD 的位点」。"}},"dondi2025":{"readFor":"2025 年的比较已经从「对 GATK」升级到「对 SComatic」。长读 + 细胞类型重注释 + scWGS 金标准。","essay":"LongSom 把 SComatic 的思路迁到高质量长读长 scRNA-seq，并加上四件短读很难同时给的东西：用突变谱重注释细胞类型、融合、CNA、mtSNV，再用 BnpC 重建克隆。Dondi 等人最锋利的一刀是重注释——错误的细胞类型会让体细胞位点被当成胚系过滤，重注释可把敏感度提升约 31%。比较协议专门为挑战锚点而写：同一长读数据上对打 SComatic；为公平把 LongSom 的 10 kb 簇过滤也加到对方上；报告每患者 Venn（重叠仅 40–72%）；对 scWGS 支持的位点算 precision 0.44–0.50 vs 0.41–0.46，sensitivity 0.19–0.55 vs 0–0.13。同一批细胞的短读对照更刺眼：短读 SComatic 只得到 114 个位点，约为长读的 1/7.3，交集仅 9——方法差距有时小于模态差距。临床读出是 SNV+融合定义的亚克隆有不同的预测治疗结局。2025 年再写 scRNA 体细胞方法，基线必须分代：只打 Strelka2 已经不够。","four":{"structure":"总览（BAM + 细胞类型 → 重注释 → SNV/mtSNV/融合/CNA → 克隆）→ 为何必须重注释 → vs SComatic 的 Venn/F1 → 长读 vs 短读模态对照 → 治疗分层。多了 Venn 和模态对比，F1 不再是唯一语言。","compare":"直接挑战领域锚点。对齐过滤（10 kb 簇），升级金标准到 scWGS，并加一个「同一细胞、不同模态」的自身对照。重叠低本身就是结果：caller 仍在抓不同的真/假集。","metrics":"Precision、Sensitivity、F1、call overlap、scWGS support、clone recovery。敏感度是拉开差距的轴；精度与 SComatic 相近。短读位点倍数（×1/7.3）是模态指标，不是算法指标。","angle":"细胞类型错误是假阴性来源，不是小预处理细节。长读同时给 SNV、融合、CNA，克隆重建不再只靠点突变。金标准从 bulk WES 升到 scWGS。"}},"nrc2025":{"readFor":"两栏短评的价值：把长文的假设提取成可证伪清单，方便你在自己的论文里引用或反驳。","essay":"Nature Reviews Cancer 的 Tools of the Trade 用两栏篇幅把 SComatic 写清楚。它几乎不做新实验，而是把原论文散落在 Methods 里的假设整理成「挑战–对策」配对：稀疏、胚系污染、表达导致的深度不均、RNA editing、伪差，每一条对应一个算法动作（轨迹假设→按细胞类型堆 reads；假阳性→多态/editing/PoN/深度）。核心假设被写成一句可证伪的话：大多数体细胞突变发生在同一分化轨迹的细胞类型中。2026 年的食管调查和 LongSom 的重注释，打的就是这句。短评型文章在调研里常常被忽略，但它是写 Introduction 最好的提纲——也是批判文章最容易找到的缝。","four":{"structure":"问题清单 → 算法如何一对一作答。没有 Results 数字节。体裁决定结构：短、可引用、把假设暴露出来。","compare":"不比较分数，比较「挑战–对策」配对。适合作为他人 Introduction 的提纲，而不是基准表的一行。","metrics":"定性。它的「值」是假设是否写清，不是 F1。","angle":"把方法的假设写成可证伪清单。这正是后续批判与复现文章的切入点。"}},"esophagus2026":{"readFor":"领域第二阶段：不再发明 caller，而是用正交对照压力测试当前最佳。比较的值从 F1 换成共享率。","essay":"这篇 bioRxiv 调查代表方法学进入第二阶段。作者先承认 SComatic 是目前最稳健的工具，按官方教程跑完，再用同窝小鼠和同一人类供体的多活检做正交对照。发现很不舒服：跨文库共享的位点更像 SNP 或扩增/测序伪差，而不是体细胞；约 30% 与 dbSNP 且在 1KG/gnomAD 有频率的位点重叠。额外过滤后约 70% 可视为较可信体细胞；未知位点的克隆大小与基因结构类似已知体细胞。原论文报告的 DNA 回收大约在 40–70%——F1 可能在同一分子逻辑里被高估，因为金标准与过滤共享许多假设。比较的值从 F1 换成跨个体共享率、数据库重叠、克隆大小和基因结构注释。它不重跑 Liu 的七个 caller，只对「当前最佳」做外部效度检验。结论也不是推翻：SComatic 仍被当作目前最可用的起点，只是必须加跨样本对照。审稿人现在会问 germline 泄漏，这篇就是原因。","four":{"structure":"复现 → 正交胚系对照（同窝 / 多活检）→ 数据库交集 → 过滤后的救援与生物学合理性。批判/复现文章的典型顺序：先承认工具，再设计它的假设无法内部消化的对照。","compare":"不对打旧基线，而对「当前最佳」做外部效度。金标准不是第二套 WGS，而是跨个体共享与群体数据库。这避免了与原论文用同一套逻辑互相证明。","metrics":"跨个体共享率、dbSNP/gnomAD 重叠、克隆大小、基因结构。~30% 可疑、过滤后 ~70% 较可信。这些数字无法放进 F1 柱状图，却直接打在假阳性分类表上。","angle":"原论文 F1 可能高估。跨样本共享是检测 germline 泄漏的廉价正交轴。内含子/基因间突变比例高不一定是伪差（scATAC 也有）——要靠对照，而不是区域先验一刀切。"}}},"kindLabel":{"method":"方法","benchmark":"基准","review":"综述","critique":"复现/批判","precursor":"前体"},"metrics":[{"name":"Sensitivity / TPR / Recall","what":"金标准突变中被召回的比例。scRNA 评估必须限制在 RNA 可覆盖位点，否则深度稀疏会把所有方法打到接近 0。不写 callable 定义的敏感度，不能引用。","usedBy":["Liu 2019","SComatic","RESA","LongSom"]},{"name":"Precision / PPV","what":"所报突变中为真的比例。scRNA 的主战场：bulk caller 敏感度可以很高，精度可以低到 0.06。只报精度而不报召回，等于允许把阈值拧到只剩几个位点。","usedBy":["SComatic","RESA","LongSom"]},{"name":"F1","what":"精度与敏感度的调和平均。SComatic 用它宣布全面领先（0.6–0.7 vs 0.2–0.4）。它假定假阳与假阴同等不可接受——RESA 因此拒绝用它，改报 F0.5。跨模态的 F1 不能直接比。","usedBy":["SComatic","LongSom"]},{"name":"F0.5","what":"把权重偏向精度的 F 分数。RESA 选用它，等于在方法论文里声明：假阳性比假阴性更不可接受。","usedBy":["RESA"]},{"name":"FDR / FPR","what":"假发现率 / 假阳性率。Liu 与 SCmut 的早期语言；在没有完整金标准时更自然。","usedBy":["Liu 2019","SCmut"]},{"name":"AUC","what":"分类器在阈值扫描下的整体分辨力。RESA 的联合逻辑回归用 hold-out AUC 0.79–0.98 证明过滤器可学习。","usedBy":["RESA"]},{"name":"Cosine similarity of spectra","what":"96 通道三核苷酸谱与 DNA 金标准或 COSMIC 签名的几何一致性。用来防止「统计上对、生物学上不像突变」。位点太少时拟合不稳定；应限制在该癌种已知过程上，避免过拟合 COSMIC 全集。","usedBy":["SComatic"]},{"name":"Mutation burden","what":"每细胞或每细胞类型每兆碱基突变数，与 TCGA / 配对 WES 对照。","usedBy":["SComatic"]},{"name":"Genotyping accuracy","what":"与 WGS 基因型一致的比例。Monopogen 的主指标，针对胚系而不是体细胞。","usedBy":["Monopogen"]},{"name":"ARI / Capture / Purity","what":"亚克隆重建质量。DENDRO 把比较从位点级改到细胞分区级。两个方法可以位点交集很低却有相近 ARI——不能反过来说「分区对所以 SNV 准」。","usedBy":["DENDRO","LongSom / BnpC"]},{"name":"Call overlap / Venn","what":"方法之间一致性。低重叠（LongSom vs SComatic 40–72%）本身就是结果：caller 仍在抓不同的真/假集。","usedBy":["LongSom"]},{"name":"Cross-sample sharing","what":"跨个体或跨活检的位点共享率。高共享暗示 germline 泄漏或批次伪差。批判文章的核心度量。","usedBy":["Esophagus 2026"]}],"angles":[{"n":"01","title":"问题改写","en":"Task reformulation","body":"同一份 scRNA-seq，可以被写成四个不同问题：（1）de novo 发现体细胞 SNV；（2）把 bulk DNA 已有突变基因型化到细胞；（3）重建亚克隆树；（4）估计突变负荷与签名。论文的比较对象、指标、金标准全部由这个问题选择决定。SCmut 选（2），DENDRO 选（3），SComatic/RESA 选（1），Monopogen 把（1）拆成胚系+体细胞。"},{"n":"02","title":"精度 vs 敏感度","en":"Precision as the bottleneck","body":"Liu 2019 已经显示 bulk caller 在读数足够时 TPR 可以 >99%。真正崩掉的是精度。因此 2023–2024 的方法论文把叙事改成：我们愿意牺牲敏感度（SComatic 0.33–0.56，低于 Strelka2）来换 0.67–0.87 的精度。RESA 更进一步用 F0.5。写文章时，你需要显式说出你站在权衡曲线的哪一侧。"},{"n":"03","title":"金标准的构造","en":"Ground-truth engineering","body":"几乎从没有「全部体细胞突变」的真值。通行做法：配对 WES/WGS 的体细胞集合 ∩ RNA 可覆盖位点。这会系统性低估只在未表达区域的突变，也会把 DNA caller 的假阴性当成 RNA 的假阳性。LongSom 升级到 scWGS；批判文章改用跨个体共享。你必须在 Methods 写清 callable 的定义，否则 F1 不可比。"},{"n":"04","title":"噪声本体","en":"Error taxonomy","body":"高质量论文会先给假阳性分类，再为每一类设过滤器：胚系多态（dbSNP/gnomAD）、RNA editing（REDIportal 等）、比对伪差（双 pipeline、错配标签）、扩增/文库批次（PoN、跨样本共享）、细胞类型污染（LongSom 重注释）。比较可以按「哪一类 FP 被压掉」来做，而不是只报一个总分。"},{"n":"05","title":"聚合尺度","en":"Aggregation scale","body":"单细胞 pileup 太稀疏。SComatic 聚合到细胞类型；Monopogen 聚合到细胞群体 LD；RESA 看跨细胞复发；SCReadCounts 坚持细胞水平计数。聚合提高功效，但把细胞类型错误变成系统偏差——这正是 LongSom 重注释的切入点。"},{"n":"06","title":"生物学第二裁判","en":"Biological concordance","body":"即使 F1 领先，也要证明突变「看起来像该类肿瘤的突变」：UV 签名 SBS7、MMRd 签名、BRAF V600E、与 TCGA 相当的负荷、与 scWGS 一致的亚克隆。这能挡住「高精度但全是 RNA editing」的质疑，也让审稿人有非统计的抓手。"},{"n":"07","title":"输入契约","en":"Input contract","body":"是否需要配对 DNA，是第一分类轴。SCmut / RNA-MuTect 需要；SComatic / RESA / LongSom / Monopogen 宣称不需要。不需要对照的方法必须用 PoN、群体数据库或跨样本逻辑替代。比较时应把这一条写在 Table 1，而不是埋进 Discussion。"},{"n":"08","title":"模态与技术世代","en":"Modality leap","body":"短读 10x → SMART-seq → 长读长；scRNA → scATAC → scWGS。LongSom 用同一批细胞的 LR vs SR 证明：方法差距有时小于模态差距（7.3 倍位点差）。新论文可以用「新技术 + 旧问题」切入，而不必再发明一个短读 caller。"}],"structure":[{"n":"01","title":"Title / Abstract","body":"标题几乎都是 De novo detection/identification of somatic mutations from scRNA-seq。摘要四句：为何单细胞突变重要；现有方法失败在哪（假阳性 / 需要 DNA / 不能做分化细胞）；方法名 + 规模数字；一个关键分数（F1 或 precision）+ 一个生物学能力（签名、克隆、驱动突变）。"},{"n":"02","title":"Introduction","body":"固定三段论。（1）体细胞突变驱动癌症进化、镶嵌、可塑性。（2）scDNA 贵、扩增误差大、得不到同一细胞的转录组；scRNA-seq 已成常规，但稀疏、editing、等位基因脱落、表达偏倚、胚系污染。（3）Gap：或没有专用 caller，或精度不可用。最后一句预告本文贡献，通常恰好对应后面每一节 Results。"},{"n":"03","title":"Figure 1 · 算法概览","body":"几乎必有的示意图：BAM + 细胞类型 → 过滤阶梯 → 统计检验 → 输出 VCF/细胞基因型。审稿人用这张图判断方法是否只是「阈值堆叠」。把每一步对应到一种假阳性来源。"},{"n":"04","title":"Results A · 可控实验","body":"Spike-in 或模拟。目的不是宣称真实性能，而是证明在已知真值下过滤器按设计工作。RESA 的三组织 spike-in、Liu 的 reads/VAF 扫描、DENDRO 的树模拟都属于这一层。"},{"n":"05","title":"Results B · 配对 DNA 金标准","body":"核心比较节。选 2–3 个有 WES/WGS 的肿瘤数据集（细胞系容易、原发肿瘤难）。定义 callable 位点。对每个方法报 sensitivity / precision / F1，带 bootstrap 区间与统计检验。不要只给平均值。"},{"n":"06","title":"Results C · 生物学一致性","body":"突变谱 cosine、COSMIC 签名、驱动突变回收、负荷对照、克隆热图。这一节把「caller」变成「可以做生物学的工具」。"},{"n":"07","title":"Results D · 应用 / 以前做不到的事","body":"SComatic：分化细胞与多克隆组织。RESA：耐药时间序列。DENDRO：免疫治疗新抗原。LongSom：融合+SNV 的治疗分层。应用节决定文章能发到哪一档。"},{"n":"08","title":"Discussion","body":"先复述贡献，立刻写限制：只能看到表达区域；深度决定敏感度上限；细胞类型错误；germline 泄漏（现在审稿人会问）。给出适用边界：有/无配对 DNA、短读/长读、肿瘤/正常组织。"},{"n":"09","title":"Methods 里必须写清的比较协议","body":"基线版本与参数（最小 alt 支持要对齐）；金标准来源与 callable 定义；bootstrap / 检验；签名拟合时只使用该癌种已知过程（SComatic 的做法，避免过拟合 COSMIC 全集）。"}],"protocol":[{"n":"01","title":"选定任务","body":"de novo 发现、细胞分型、克隆树、还是突变负荷/签名。任务一变，基线、指标、金标准全部重选。"},{"n":"02","title":"构造金标准","body":"配对 WES/WGS ∩ RNA 可覆盖位点是主流。细胞系容易、原发肿瘤难。LongSom 把金标准升到 scWGS；批判文章改用跨样本共享。"},{"n":"03","title":"对齐输入契约","body":"同一 BAM、同一最小 alt 支持（常见 ≥3 reads / ≥2 cells）、同一 callable 定义。不对齐阈值，F1 不可比。"},{"n":"04","title":"分层报告","body":"不要只给一个总分。按 reads、VAF、外显子/内含子、癌种、短读/长读切开。Liu 2019 是这一条的原型。"},{"n":"05","title":"统计与消融","body":"bootstrap 区间、配对检验、FDR。自身消融（RESA vs RESA-jLR；LongSom 去重注释）证明每一步不是装饰。"},{"n":"06","title":"生物学第二裁判","body":"96 通道谱 cosine、COSMIC 签名、驱动突变回收、负荷对照、克隆与 scWGS 一致。挡住「统计上对、生物学上荒谬」。"}],"stats":[{"k":"15","v":"核心文献"},{"k":"2019–2026","v":"时间跨度"},{"k":"06","v":"方法家族"},{"k":"12","v":"常用指标"}],"noise":[{"n":"01","title":"胚系多态","filter":"dbSNP / gnomAD / 1KG 频率过滤；跨个体共享","papers":"全体 de novo 方法"},{"n":"02","title":"RNA editing","filter":"REDIportal 等 editing 清单；RNA-MuTect 起即列为独立噪声类","papers":"SComatic, RESA, RNA-MuTect"},{"n":"03","title":"比对 / 扩增伪差","filter":"双 aligner 共识、错配标签、同源区域、PoN、单碱基重复","papers":"RESA, SComatic"},{"n":"04","title":"文库批次","filter":"Panel of Normals；跨活检 / 同窝对照","papers":"SComatic, Esophagus 2026"},{"n":"05","title":"细胞类型污染","filter":"按细胞类型聚合前先重注释（突变谱）","papers":"LongSom"},{"n":"06","title":"表达稀疏与等位基因脱落","filter":"只在 callable 位点计分；Beta-Binomial；跨细胞复发","papers":"全体"}],"families":[{"id":"bulk-rna","title":"Bulk caller 迁到 scRNA","methods":"SAMtools, GATK, Strelka2, FreeBayes, VarScan2, MuTect2, CTAT","job":"位点发现","verdict":"敏感度可以很高，精度在 scRNA 上通常崩溃。Liu 2019 是基准，SComatic 把它变成反面教材。"},{"id":"genotype","title":"已知突变的细胞分型","methods":"SCmut, SCReadCounts","job":"把 DNA 已有位点投到细胞","verdict":"假阳性可控，但不能 de novo。需要配对 DNA 或位点列表。"},{"id":"denovo","title":"scRNA de novo SNV","methods":"RESA, SComatic, LongSom","job":"无配对 DNA 发现体细胞 SNV","verdict":"2023 年后的主战场。精度优先，F1 0.4–0.7 是目前公开区间。"},{"id":"ld","title":"群体遗传 / LD","methods":"Monopogen","job":"稀疏覆盖下的胚系分型 + 体细胞共分离","verdict":"比较语言是 genotyping accuracy 与规模，不是与 SComatic 对打 F1。"},{"id":"clone","title":"亚克隆 / 系统发育","methods":"DENDRO, BnpC","job":"细胞分区与进化树","verdict":"指标换成 ARI / capture / purity。突变检出只是中间产物。"},{"id":"cnv","title":"从表达推断体细胞 CNA","methods":"inferCNV, CopyKAT, HoneyBADGER, CaSpER, Numbat, SCEVAN","job":"拷贝数、恶性细胞鉴定、亚克隆","verdict":"与 SNV caller 平行的另一大家族。Numbat 在多组学金标准上总体领先；CopyKAT 在纯表达输入时更稳。"}],"howto":[{"n":"01","title":"先写 Table 1，再写算法","body":"列：工具、模态、de novo 与否、是否需配对 DNA、聚合尺度、主指标。审稿人 30 秒内知道你填的是哪一个空格。"},{"n":"02","title":"基线要分代","body":"2019 年对 GATK；2024 年对 SComatic；2025 年对 SComatic + 模态（LR/SR）。不要只打已经公认失败的 bulk caller。"},{"n":"03","title":"F1 不是唯一语言","body":"精度优先用 F0.5；克隆任务用 ARI；胚系用 genotyping accuracy；批判复现用跨样本共享率。指标选择本身就是论点。"},{"n":"04","title":"Callable 必须写进 Methods","body":"「配对 WES 的体细胞 ∩ scRNA ≥1 read」与「全基因组」是完全不同的分母。跨论文引用数字前先对齐分母。"},{"n":"05","title":"给假阳性一张分类表","body":"多态 / editing / 比对 / 批次 / 细胞类型。每一种对应一个过滤器，再做消融。比「我们过滤更严」更可审。"},{"n":"06","title":"第二裁判一定要有","body":"签名 cosine、驱动突变、负荷、克隆树。没有生物学一致性的 F1 领先，现在很难过审。"}],"cnv":[{"name":"inferCNV","year":"2016–","idea":"相对正常参考的表达平滑 → CNA","win":"亚克隆鉴定（单平台）","lose":"跨平台批次敏感"},{"name":"CopyKAT","year":"2021","idea":"整倍体核型，纯表达矩阵","win":"无等位基因时的默认选择；恶性/正常分类","lose":"拷贝中性 LOH 弱"},{"name":"HoneyBADGER","year":"2016","idea":"表达 + 等位基因 HMM","win":"早期方法学","lose":"稀有亚群、敏感度"},{"name":"CaSpER","year":"2020","idea":"多尺度表达 + BAF","win":"CNA 敏感度/特异度平衡","lose":"计算与参考选择敏感"},{"name":"Numbat","year":"2022","idea":"单倍型感知 HMM + 表达 + 等位基因 + 进化","win":"多数基准总分第一；cnLOH","lose":"需要群体相位信息"},{"name":"SCEVAN","year":"2022","idea":"自动恶性/正常 + 克隆断点","win":"克隆断点","lose":"肿瘤比例低时分类差"}],"bench":[{"method":"SAMtools","role":"bulk pileup","precision":"低–中（视区域）","sensitivity":"最高之一","f1":"中","needsDna":"否","note":"Liu：低 reads 下最灵敏；内含子特异性差"},{"method":"Strelka2","role":"bulk somatic","precision":"0.06–0.24*","sensitivity":"高于 SComatic","f1":"0.2–0.4*","needsDna":"否（被这样跑）","note":"*SComatic 文中作为次优；读数充足时 Liu 认为稳定"},{"method":"VarScan2","role":"bulk somatic","precision":"低","sensitivity":"高，需更多 reads","f1":"低","needsDna":"常需配对","note":"敏感度高但 scRNA 假阳性多"},{"method":"Monovar","role":"scDNA","precision":"低","sensitivity":"低于 SComatic","f1":"低","needsDna":"否","note":"为扩增后的 scDNA 设计，迁到 RNA 不匹配"},{"method":"SCReadCounts","role":"scRNA 计数","precision":"低（发现模式）","sensitivity":"高","f1":"低","needsDna":"否","note":"本不是 caller；SComatic 基线中敏感度高"},{"method":"SCmut","role":"细胞分型","precision":"FPR 受控","sensitivity":"受限于 bulk 集合","f1":"—","needsDna":"是","note":"不能 de novo"},{"method":"RESA","role":"scRNA de novo","precision":"0.75–0.87","sensitivity":"中（jLR 提高）","f1":"F0.5 领先","needsDna":"否","note":"细胞系/PDX 上精度优先"},{"method":"SComatic","role":"scRNA/ATAC de novo","precision":"0.67–0.87","sensitivity":"0.33–0.56","f1":"0.6–0.7","needsDna":"否","note":"当前短读锚点方法"},{"method":"Monopogen","role":"胚系+体细胞","precision":"胚系 95% 一致","sensitivity":"胚系 100K–3M","f1":"未对打 SComatic","needsDna":"否（用 LD 面板）","note":"比较语言不同"},{"method":"LongSom","role":"长读 de novo","precision":"0.44–0.50","sensitivity":"0.19–0.55","f1":"高于 SComatic（同 LR）","needsDna":"否","note":"精度相近、敏感度更高；需长读"}],"chart":[{"name":"SComatic","f1":0.65,"precision":0.77,"sensitivity":0.45},{"name":"Strelka2","f1":0.3,"precision":0.15,"sensitivity":0.62},{"name":"RESA","f1":0.55,"precision":0.75,"sensitivity":0.4},{"name":"LongSom","f1":0.48,"precision":0.47,"sensitivity":0.37},{"name":"SAMtools","f1":0.28,"precision":0.18,"sensitivity":0.58},{"name":"Monovar","f1":0.2,"precision":0.12,"sensitivity":0.25}],"hero":{"kicker":"Survey  ·  2019–2026","title":"Somatic / Review","lede":"使用单细胞 RNA-seq 研究体细胞突变的算法文献：文章怎么写、如何与其他方法比较、比较什么值、从什么角度切入。十五篇构成一条方法学线索，不是一份工具安装手册。","sub":"同一份 BAM 可以被写成四个不同的科学问题。问题一变，基线、指标、金标准和论文骨架全部重选。下面按这个顺序读：先看问题，再看十五篇文章各自填了哪一格。"},"problem":{"left":"单细胞全基因组测序能看到每个细胞的突变，但贵、扩增误差大，并且拿不到同一细胞的转录组。scRNA-seq 已经是肿瘤与组织图谱的常规武器——如果能从中读出体细胞突变，就可以在同一批细胞上同时做基因型与表型：克隆归属、耐药、新抗原、正常组织镶嵌，都不必再另做一套 scDNA。","right":"代价是一套特有噪声：表达稀疏、等位基因脱落、RNA editing、胚系泄漏、文库批次、细胞类型污染。2019 年以来的算法文章，本质上都在给这张噪声表配过滤器，并证明过滤器之后仍能做生物学。过滤器配完，还要决定你比较的是位点、是细胞、还是过程（负荷与签名）——三者用的不是同一套分数。","extra":"这条线索有一个容易被忽略的分岔。点突变（SNV/indel）是 SComatic / RESA / LongSom 的主战场；拷贝数（CNA）是 Numbat / CopyKAT / inferCNV 的平行世界。许多综述把它们写进同一节「从 scRNA 读体细胞改变」，却用 SNV 的 F1 去理解 CNA 的剖面一致性。本站把两条线分开：主线是 SNV 的文章结构与比较协议，CNA 只作为必须写进调研的平行家族。","tasks":[{"n":"01","t":"发现","d":"de novo 体细胞 SNV","note":"无配对 DNA 找出位点。SComatic、RESA、LongSom。主指标 precision / F1 / F0.5。"},{"n":"02","t":"分型","d":"已知突变投到细胞","note":"有位点列表或 bulk DNA。SCmut、SCReadCounts、cellsnp-lite。主指标 FPR、细胞覆盖。"},{"n":"03","t":"克隆","d":"亚克隆树与归属","note":"位点是中间产物。DENDRO、BnpC、Numbat。主指标 ARI / capture / purity。"},{"n":"04","t":"过程","d":"负荷、签名、CNA","note":"问突变像不像该类肿瘤。SComatic 的 SBS7 cosine、负荷 vs TCGA；CNA 剖面 vs WGS。"}]},"corpus":{"intro":"按时间读，会看见问题被改写了三次。2019 年：bulk caller 能不能用，以及有配对 DNA 时如何把突变投到细胞。2020–2022 年：克隆树、计数矩阵、综述能力表、CNA 平行线。2023–2024 年：de novo 爆发，RESA 与 SComatic 把精度写成主叙事，Monopogen 把 LD 写成另一套语言。2025–2026 年：不再只发明 caller，开始挑战锚点（LongSom）和压力测试锚点（食管调查）。","howToRead":"点进每篇先看四块：章节骨架（它填了九格里的哪几格）、比较协议（和谁比、金标准从哪来）、指标（报的是 F1 还是 ARI）、切入角度（它改写了哪个问题）。有原图的章节把图嵌在对应论证下面，用来核对「这一节实际在比什么」。"},"timeline":[{"year":"2019","title":"基准与分型","body":"Liu 把七个 bulk caller 打在 scRNA 上，结论是条件化推荐。SCmut 证伪直接 calling，改做已知突变的细胞分型。RNA-MuTect 虽是 bulk，却留下 editing / germline / ASE 必须切开的噪声本体。"},{"year":"2020","title":"任务改写成树","body":"DENDRO 承认点突变检出不可靠，把终点改成亚克隆。ARI 取代 F1。此后凡是「用 scRNA 做克隆」的文章，都可以不再把位点级精度当作第一句。"},{"year":"2021–22","title":"中间件、能力表、CNA","body":"SCReadCounts 与 cellsnp-lite 把计数矩阵从判定器里拆出去。Xu 综述用模态 × 配对对照画能力表，并写明 scRNA de novo 仍稀缺。scAllele 把变异连到剪接。Numbat 打开单倍型 CNA 平行线。"},{"year":"2023–24","title":"de novo 成为主战场","body":"RESA 用 F0.5 声明精度优先；SComatic 用细胞类型聚合 + 无配对 DNA 成为短读锚点；Monopogen 用 LD 走另一条路，故意不对打 F1。同一年两篇 Nat Biotech，比较语言完全不同。"},{"year":"2025–26","title":"挑战锚点、测试锚点","body":"LongSom 把基线从 GATK 升级到 SComatic，金标准升到 scWGS，并证明模态差距可以大于方法差距。NRC 短评把假设写成可证伪清单。食管调查用跨样本共享打 germline 泄漏。领域进入第二阶段。"}],"structureCopy":{"intro":"方法论文不是自由散文。SComatic、RESA、LongSom、DENDRO 的章节顺序可以重叠到一张九格表上。差别只在每一格填什么证据，以及有些文章故意留空——DENDRO 几乎不上位点 F1，食管调查不上新算法示意图。","extra":"审稿人通常按这个顺序抓稿：摘要有没有一个分数加一个生物学能力；Figure 1 的每一步是否对应一种假阳性；Results B 的 callable 是否写清；有没有消融；Discussion 有没有主动写出细胞类型错误和 germline 泄漏。九格不是审美，是答辩顺序。"},"fills":[{"paper":"SComatic","fill":"九格几乎填满。Results B 是三肿瘤对 WES/WGS 的 F1，Results C 是 SBS7 cosine 0.98，Results D 是分化细胞与 scATAC。Discussion 承认稀疏。"},{"paper":"RESA","fill":"Results A 的 spike-in 特别完整（精度 0.77）。Results B 是 15 细胞系的 F0.5。自身消融占掉通常给「对打 SComatic」的位置——因为当时锚点还没立住。"},{"paper":"DENDRO","fill":"故意不上位点 F1。Results B 是 ARI，Results D 是免疫治疗新抗原，外加 DENDROplan 把实验设计写成可比较的一层。"},{"paper":"LongSom","fill":"在 SComatic 骨架上多两格：细胞类型重注释的消融，以及同一细胞的长读/短读模态对照。Venn 成为和 F1 并列的主图。"},{"paper":"Liu 2019","fill":"没有算法 Figure 1。模拟、真实、参数扫描三节代替 Results A/B。终点是菜单不是冠军。这是基准论文对九格的改写。"},{"paper":"Esophagus","fill":"不上新方法。整篇是对锚点的 Results B 压力测试，金标准换成正交对照。批判文章可以只填九格里的一格，但必须把这一格做硬。"}],"protocolCopy":{"intro":"比较不是「把别人的工具跑一遍」。它是一套协议：任务、金标准、输入契约、分层、统计、生物学第二裁判。漏掉任何一层，F1 都不可引用。跨论文柱状图尤其危险——SComatic 的精度来自原文 Fig. 3，LongSom 的分母已经换成 scWGS 可覆盖位点，两者不能直接比大小。","extra":"协议还有一条隐规则：基线要分代。2019 年对 GATK 是新结果；2024 年再只打 Strelka2，审稿人会问为什么不对 SComatic。2025 年还要对模态（长读/短读）和细胞类型注释质量负责。把「我们比某个已公认失败的 bulk caller 高」写成贡献，现在很难过关。"},"fails":[{"skip":"选定任务","fail":"把 SCmut 的 FPR、SComatic 的 F1、DENDRO 的 ARI 放进同一张表。三个数字都对，但回答的不是同一个问题。"},{"skip":"构造金标准","fail":"用全基因组当分母，所有方法敏感度都接近 0；或用与过滤同一套逻辑的 DNA caller 当真值，F1 被内部高估。"},{"skip":"对齐输入契约","fail":"一方最小 alt 支持 3 reads、另一方 5 reads；一方有细胞类型、另一方没有。阈值购物会伪装成方法优势。"},{"skip":"分层报告","fail":"一个总分掩盖 VAF 25% 时的崩溃、内含子特异性差、短读可检测集合本身很窄。Liu 2019 专门反对这件事。"},{"skip":"统计与消融","fail":"过滤器堆成黑盒。审稿人无法知道 Beta-Binomial、PoN、重注释哪一步在干活。RESA-jLR 与 LongSom 去重注释就是在回答这个问题。"},{"skip":"生物学第二裁判","fail":"高精度但谱不像该类肿瘤——可能全是 RNA editing 或批次伪差。SBS7 cosine、BRAF V600E、负荷 vs TCGA 是挡住这类质疑的最小集合。"}],"metricsCopy":{"intro":"指标选择本身就是论点。报 F1 是在说「两边都要」；报 F0.5 是在说「假阳性更不可接受」；报 ARI 是在说「我比较的不是位点，是细胞分区」；报跨样本共享率是在说「我怀疑你的真阳性里仍有 SNP」。先读指标，再读分数。","extra":"同一名称在不同论文里分母不同。SComatic 的 sensitivity 限制在 RNA 至少 1 read 的位点；LongSom 进一步要求 scWGS 支持；Liu 的 TPR 在模拟里是植入位点的全体。引用任何数字之前，先抄 callable 的定义。本站图表里的 F1 是便于并排对照的代表性区间，不是一次联合重跑。"},"traps":[{"name":"Sensitivity","trap":"不限制在 callable 位点时，深度稀疏会把所有方法打到接近 0，看起来像「谁都不行」，其实是分母错了。"},{"name":"Precision","trap":"会随过滤变严而上升、敏感度下降。只报精度等于允许作者把阈值拧到只剩几个位点。必须和召回一起看，或改用 F0.5 并画出曲线。"},{"name":"F1","trap":"假定假阳与假阴同等不可接受。SComatic 用它宣布全面领先；RESA 拒绝用它，因为叙事是精度优先。跨模态（短读 vs 长读）的 F1 更不能直接比。"},{"name":"F0.5","trap":"把权重偏向精度，是诚实的，也会让对敏感度友好的方法看起来更差。选用它时必须在正文里把权衡说出来。"},{"name":"Cosine of spectra","trap":"对突变数量敏感：位点太少时，签名拟合不稳定。SComatic 限制在该癌种已知过程上拟合，避免过拟合 COSMIC 全集——这步必须写进 Methods。"},{"name":"ARI","trap":"衡量分区而非位点。两个方法可以位点交集很低，却有相近的 ARI。不能反过来说「ARI 高所以 SNV 准」。"}],"anglesCopy":{"intro":"新文章很少再靠「我们 F1 高 0.03」过关。八条反复出现的切入，决定了你和谁比、比什么、金标准从哪来。选切入就是选论文的对手盘：选「问题改写」你的对手是任务定义，选「模态跃迁」你的对手是短读本身，选「正交对照」你的对手是锚点方法的外部效度。","extra":"一个常见错误是把八条全写进同一篇。SComatic 能叠五条，是因为它是锚点级工作量。普通方法论文选一条主切入、一条第二裁判就够：例如「细胞类型重注释」（LongSom）加「scWGS 支持」；或「F0.5 精度优先」（RESA）加「BRAF 回收」。切入越多，每一条的证据都要配得上，否则像购物清单。"},"atlasCopy":{"intro":"把工具按任务家族排，比按年份排更不容易比错。bulk caller、细胞分型、de novo SNV、LD、亚克隆树、表达推断 CNA，六行用六种比较语言。跨行引用数字，几乎一定错。","cnv":"独立基准（2025）的结论相当稳定：Numbat 在多数任务总分第一；CopyKAT 在只有表达矩阵时更稳；inferCNV 擅长单平台亚克隆。SComatic 自己也用 Numbat 做克隆对照。写 SNV 方法论文时，用 CNA 做第二裁判是加分，用 CNA 工具的分数来证明 SNV caller 更好则是加乱。"},"howtoCopy":{"intro":"下面六条是从十五篇文章的 Methods / Discussion 里抽出来的可执行清单。不是风格建议。漏掉 callable 定义或假阳性分类表，现在比漏掉一个基线更容易被拒。"},"pitfalls":[{"n":"01","title":"把中间件放进 caller 排行榜","body":"cellsnp-lite 的 mode 2、SCReadCounts 的 discovery 模式，输出的是计数或候选，不是经过体细胞判定的 VCF。拿它们的「敏感度高」对比 SComatic，是在奖励没有闸门的方法。"},{"n":"02","title":"引用跨论文 F1 而不对齐分母","body":"SComatic Fig. 3 的短读 WES 可覆盖位点，和 LongSom 的 scWGS 支持位点，不是同一个集合。本站图表已经标明「非联合重跑」。正文里再引一次数字，仍要写清来源图号。"},{"n":"03","title":"只用配对 DNA 当金标准、从不用正交对照","body":"DNA caller 与 RNA caller 共享比对误差和胚系过滤逻辑时，一致的位点可以同时为假。食管调查用同窝/多活检共享，打的就是这个盲区。"},{"n":"04","title":"细胞类型当作无误差的输入","body":"SComatic 的聚合单位是细胞类型。注错了，体细胞会被当成胚系丢掉。LongSom 证明重注释可换来约 31% 敏感度。Methods 必须写注释来源和是否迭代。"},{"n":"05","title":"Discussion 不写适用边界","body":"有/无配对 DNA、短读/长读、肿瘤/正常组织、10x / SMART-seq / 长读，边界不写就等于暗示方法普遍适用。锚点论文反而写得最清楚——后来者更应该写。"},{"n":"06","title":"综述用一张 F1 表结束所有家族","body":"Xu 2019–2022 的教训是能力表优于排行榜。2026 年再写综述，至少需要两张表：SNV 任务的指标语言，以及 CNA 任务的剖面语言。"}]};
const $ = (s) => document.querySelector(s);
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&","<":"<",">":">","\"":""" }[c]));
}
function header() {
  const nav = [
    ["#problem","01 问题"],["#corpus","02 文献"],["#structure","03 结构"],
    ["#protocol","04 比较"],["#metrics","05 指标"],["#angles","06 角度"],
    ["#atlas","07 算法"],["#howto","08 写法"]
  ].map(([h,l]) => `<a href="${h}">${l}</a>`).join("");
  return `<header><div class="wrap g">
    <a class="brand" href="#">Somatic <span class="slash">/</span> Review</a>
    <nav aria-label="章节">${nav}</nav>
  </div></header>`;
}
function footer() {
  return `<footer><div class="wrap g">
    <div class="a">
      <p style="font-family:'Inter Tight',sans-serif;font-size:1.5rem;margin:0">Somatic <span class="slash">/</span> Review</p>
      <p style="margin:16px 0 0;max-width:28rem;font-size:14px;line-height:1.65;opacity:.75">针对使用单细胞 RNA-seq 研究体细胞突变的算法文献调研。结构、比较协议、指标与切入角度整理自 2019–2026 年公开论文。每篇文献都按同一组四个问题拆开。</p>
    </div>
    <div class="b">

}
function section(id, n, kicker, title, inner) {

}
function bars() {
  const max = 1;
  return `<div class="bars">

  </div>`;
}

}

    `<p class="muted">${esc(DATA.metricsCopy.intro)}</p>
     <p class="muted" style="margin-top:16px">${esc(DATA.metricsCopy.extra)}</p>
     <div class="box">${metrics}</div>
     <h3 class="h3">数字会藏什么</h3>
     <div class="cols cols-2">${traps}</div>`)}
  ${section("angles","06","Angles","从什么角度切入",
    `<p class="muted">${esc(DATA.anglesCopy.intro)}</p>
     <p class="muted" style="margin-top:16px">${esc(DATA.anglesCopy.extra)}</p>
     <div class="cols cols-2">${angles}</div>
     <h3 class="h3">假阳性分类表</h3>
     <p class="small">高质量论文先给噪声本体，再为每一类设过滤器。</p>
     <div class="cols cols-3">${noise}</div>`)}
  ${section("atlas","07","Atlas","算法家族与对照表",
    `<p class="muted">${esc(DATA.atlasCopy.intro)}</p>
     <div class="cols cols-2">${fam}</div>
     <div style="overflow-x:auto"><table><thead><tr><th>方法</th><th>角色</th><th>Precision</th><th>Sensitivity</th><th>F1</th><th>配对 DNA</th><th>笔记</th></tr></thead><tbody>${rows}</tbody></table></div>
     <h3 class="h3">平行家族：从表达读体细胞 CNA</h3>
     <p class="small">${esc(DATA.atlasCopy.cnv)}</p>
     <div class="cols cols-3">${cnv}</div>`)}
  ${section("howto","08","Practice","如果你要写下一篇",
    `<p class="muted">${esc(DATA.howtoCopy.intro)}</p>

}
function paperPage(id) {
  const p = DATA.papers.find(x => x.id === id);
  if (!p) return header() + `<main class="wrap" style="padding:80px 16px"><p class="mono">404</p><h1>文献未找到</h1><a class="btn" href="#">返回索引</a></main>` + footer();
  const e = DATA.essays[id];
  const four = e ? [
    ["01","文章结构", e.four.structure],
    ["02","如何比较", e.four.compare],
    ["03","比较什么值", e.four.metrics],
    ["04","从何切入", e.four.angle],
  ].map(([n,t,b]) => `<div class="row"><div class="num" style="font-size:1rem"><p class="mono" style="margin:0">${n}</p>${esc(t)}</div><div class="body"><p class="small" style="margin:0">${esc(b)}</p></div></div>`).join("") : "";
  const struct = p.structure.map(s => `<div class="row"><div class="num">${s.n}</div><div class="body"><h3 style="margin:0">${esc(s.title)}</h3><p class="small" style="margin:8px 0 0">${esc(s.note)}</p></div></div>`).join("");
  const compared = p.comparedTo.map(c => `<li style="margin:8px 0">${esc(c)}</li>`).join("");
  const datasets = p.datasets.map(d => `<li style="margin:4px 0;color:var(--muted)">${esc(d)}</li>`).join("");
  const metrics = p.metricsUsed.map(m => `<span class="chip">${esc(m)}</span>`).join("");
  const angles = p.angles.map((a,i) => `<div class="row"><div class="num">${String(i+1).padStart(2,"0")}</div><div class="body"><p class="small" style="margin:0">${esc(a)}</p></div></div>`).join("");
  const findings = p.keyFindings.map((f,i) => `<div class="row"><div class="num">${String(i+1).padStart(2,"0")}</div><div class="body"><p class="small" style="margin:0">${esc(f)}</p></div></div>`).join("");
  const nums = p.numbers.map(n => `<div class="cell"><p style="font-family:'Inter Tight',sans-serif;font-size:1.5rem;margin:0">${esc(n.value)}</p><p class="faint" style="margin:8px 0 0">${esc(n.label)}</p></div>`).join("");
  return `
  ${header()}
  <section><div class="wrap g">
    <div class="sec-k">
      <a class="mono" href="#" style="text-decoration:none">← Index</a>
      <p class="en" style="margin-top:32px">${p.year}</p>
      <p class="idx" style="margin-top:12px">${esc(DATA.kindLabel[p.kind])}</p>
      ${p.tool ? `<p style="font-family:'Inter Tight',sans-serif;font-size:2.2rem;margin:32px 0 0">${esc(p.tool)}</p>` : ""}
    </div>
    <div class="sec-b">
      <h2>${esc(p.titleZh)}</h2>
      <p class="small" style="margin-top:20px">${esc(p.title)}</p>
      <p class="faint" style="margin-top:20px">${esc(p.short)}  ·  ${esc(p.journal)}</p>
      <p style="margin-top:28px;max-width:48rem;line-height:1.65;font-size:15px">${esc(p.oneLiner)}</p>
      ${e ? `<p class="muted" style="margin-top:20px">${esc(e.essay)}</p>` : ""}
      <div style="margin-top:24px">
        <a class="btn solid" href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noreferrer">DOI ${esc(p.doi)}</a>
        ${p.github ? `<a class="btn" href="${esc(p.github)}" target="_blank" rel="noreferrer">Code</a>` : ""}
      </div>
    </div>
  </div></section>
  <section><div class="wrap g"><div class="sec-k"><p class="idx">Numbers</p></div><div class="sec-b"><div class="cols cols-3">${nums}</div></div></div></section>
  ${e ? section("four","—","Four questions","这篇文章怎样回答四个问题",
    `<p class="small" style="margin-bottom:24px">${esc(e.readFor)}</p><div class="box">${four}</div>`) : ""}
  ${section("st","—","Structure","这篇文章怎么组织", `<div class="box">${struct}</div>`)}
  ${section("cmp","—","Comparison","如何与其他方法比较",
    `<p style="max-width:48rem;line-height:1.65;font-size:15px">${esc(p.howTheyCompare)}</p>
     <div class="cols cols-2" style="margin-top:32px">
       <div class="cell"><p class="mono">Compared to</p><ul style="padding-left:18px">${compared}</ul></div>
       <div class="cell"><p class="mono">Ground truth</p><p class="small">${esc(p.groundTruth)}</p>
         <p class="mono" style="margin-top:24px">Datasets</p><ul style="padding-left:18px">${datasets}</ul></div>
     </div>`)}
  ${section("met","—","Metrics","比较什么值", `<div>${metrics}</div>`)}
  ${section("ang","—","Angles","从什么角度切入", `<div class="box">${angles}</div>`)}
  ${section("find","—","Findings","关键发现",
    `<div class="box">${findings}</div>
     <p style="margin-top:32px;max-width:48rem;line-height:1.65;border-top:1px solid var(--ink);padding-top:24px"><span class="mono">Takeaway  </span>${esc(p.takeaway)}</p>`)}
  ${footer()}`;
}
function route() {
  const h = location.hash.replace(/^#/, "");
  const m = h.match(/^\/p\/([^/]+)/);
  document.getElementById("app").innerHTML = m ? paperPage(m[1]) : home();
  if (!m) {
    document.querySelectorAll(".filters button").forEach(btn => {
      btn.addEventListener("click", () => { kind = btn.getAttribute("data-k"); route(); const el = document.getElementById("corpus"); if (el) el.scrollIntoView({block:"start"}); });
    });
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
